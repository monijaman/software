    <text x="65" y="66" text-anchor="middle" font-size="11" fill="#6d28d9">key → number</text>
  </g>
  <g stroke="#8b5cf6" stroke-width="2.5" fill="none"><path d="M350 120 C 390 110, 400 100, 440 94"/><path d="M350 130 C 390 150, 400 180, 440 186"/><path d="M350 140 C 390 130, 400 105, 440 98"/></g>
