<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="720" height="260" fill="#ffffff"/>
  <g font-family="Consolas, monospace" font-size="14" font-weight="700">
    <g transform="translate(30 50)"><rect width="110" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="55" y="23" text-anchor="middle" fill="#1e3a8a">"apple"</text></g>
    <g transform="translate(30 112)"><rect width="110" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="55" y="23" text-anchor="middle" fill="#1e3a8a">"banana"</text></g>
    <g transform="translate(30 174)"><rect width="110" height="36" rx="8" fill="#dbeafe" stroke="#3b82f6"/><text x="55" y="23" text-anchor="middle" fill="#1e3a8a">"grape"</text></g>
  </g>
  <g stroke="#94a3b8" stroke-width="2.5"><line x1="140" y1="68" x2="220" y2="120"/><line x1="140" y1="130" x2="220" y2="130"/><line x1="140" y1="192" x2="220" y2="140"/></g>
