      <rect width="60" height="220" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <g fill="#64748b" text-anchor="middle"><text x="30" y="30">0</text><text x="30" y="58">1</text><text x="30" y="86">2</text><text x="30" y="114" font-weight="700" fill="#7c3aed">3</text><text x="30" y="142">4</text><text x="30" y="170">5</text><text x="30" y="198" font-weight="700" fill="#7c3aed">6</text></g>
    </g>
    <g transform="translate(510 102)"><rect width="88" height="24" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="8" y="17" fill="#78350f">apple:🍎</text></g>
    <path d="M598 114 H610" stroke="#94a3b8" stroke-width="2"/>
    <g transform="translate(610 102)"><rect width="92" height="24" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="8" y="17" fill="#78350f">grape:🍇</text></g>
    <g transform="translate(510 186)"><rect width="100" height="24" rx="5" fill="#fef3c7" stroke="#f59e0b"/><text x="8" y="17" fill="#78350f">banana:🍌</text></g>
  </g>
  <text x="606" y="90" text-anchor="middle" font-size="11" fill="#b45309">collision → chain</text>
  <text x="360" y="252" text-anchor="middle" font-size="13" fill="#475569">No scanning: hash the key, jump to its bucket → O(1) on average</text>
