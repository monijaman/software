<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="720" height="210" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Max sum of 3 consecutive numbers</text>
  <g font-family="Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">
    <g transform="translate(110 70)">
      <rect width="76" height="56" rx="8" fill="#fee2e2" stroke="#f87171" stroke-width="2"/><text x="38" y="36" fill="#7f1d1d">2</text>
      <rect x="84" width="76" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="122" y="36" fill="#334155">1</text>
      <rect x="168" width="76" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="206" y="36" fill="#334155">5</text>
      <rect x="252" width="76" height="56" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="290" y="36" fill="#14532d">1</text>
      <rect x="336" width="76" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="374" y="36" fill="#334155">3</text>
      <rect x="420" width="76" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="458" y="36" fill="#334155">2</text>
    </g>
  </g>
  <rect x="100" y="60" width="256" height="76" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="184" y="56" width="256" height="84" rx="12" fill="none" stroke="#6366f1" stroke-width="4"/>
  <text x="148" y="54" text-anchor="middle" font-size="12" fill="#64748b">old window = 8</text>
  <text x="312" y="160" text-anchor="middle" font-size="13" font-weight="800" fill="#4338ca">new window = 8 − 2 + 1 = 7</text>
  <text x="148" y="160" text-anchor="middle" font-size="12" fill="#b91c1c">− leaves</text>
  <text x="400" y="176" text-anchor="middle" font-size="12" fill="#15803d">+ enters</text>
  <text x="360" y="200" text-anchor="middle" font-size="13" fill="#475569">Each slide costs O(1), so the whole scan is O(n) instead of O(n × k)</text>
</svg>
