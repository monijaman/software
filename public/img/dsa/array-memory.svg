<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="720" height="220" fill="#ffffff"/>
  <text x="40" y="36" font-size="15" font-weight="800" fill="#0f172a">const scores = [42, 17, 93, 8, 61, 30]</text>
  <g font-family="Consolas, monospace" text-anchor="middle">
    <g transform="translate(40 60)">
      <rect width="100" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="50" y="44" font-size="22" font-weight="700" fill="#78350f">42</text>
      <rect x="104" width="100" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="154" y="44" font-size="22" font-weight="700" fill="#78350f">17</text>
      <rect x="208" width="100" height="70" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="3"/><text x="258" y="44" font-size="22" font-weight="700" fill="#78350f">93</text>
      <rect x="312" width="100" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="362" y="44" font-size="22" font-weight="700" fill="#78350f">8</text>
      <rect x="416" width="100" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="466" y="44" font-size="22" font-weight="700" fill="#78350f">61</text>
      <rect x="520" width="100" height="70" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/><text x="570" y="44" font-size="22" font-weight="700" fill="#78350f">30</text>
      <g font-size="13" fill="#64748b"><text x="50" y="92">[0]</text><text x="154" y="92">[1]</text><text x="258" y="92">[2]</text><text x="362" y="92">[3]</text><text x="466" y="92">[4]</text><text x="570" y="92">[5]</text></g>
      <g font-size="11" fill="#94a3b8"><text x="50" y="110">0x100</text><text x="154" y="110">0x108</text><text x="258" y="110">0x110</text><text x="362" y="110">0x118</text><text x="466" y="110">0x120</text><text x="570" y="110">0x128</text></g>
    </g>
  </g>
  <path d="M298 196 C 298 176, 298 186, 298 176" stroke="#d97706" stroke-width="3"/>
  <path d="M290 182 l8 -12 8 12z" fill="#d97706"/>
  <text x="310" y="200" font-size="13" fill="#92400e"><tspan font-family="Consolas, monospace" font-weight="700">scores[2]</tspan> → start 0x100 + 2 × 8 bytes = 0x110 → one jump, O(1)</text>
</svg>
