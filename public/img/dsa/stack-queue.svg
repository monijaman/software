<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="720" height="260" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <text x="160" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#7c3aed">Stack · LIFO</text>
  <g font-family="Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="100" y="80" width="120" height="30" rx="15" fill="#c4b5fd" stroke="#7c3aed" stroke-width="2"/><text x="160" y="100" fill="#4c1d95">C (top)</text>
    <rect x="100" y="114" width="120" height="30" rx="15" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/><text x="160" y="134" fill="#4c1d95">B</text>
    <rect x="100" y="148" width="120" height="30" rx="15" fill="#ede9fe" stroke="#a78bfa" stroke-width="2"/><text x="160" y="168" fill="#4c1d95">A</text>
    <rect x="90" y="182" width="140" height="10" rx="5" fill="#94a3b8"/>
  </g>
  <path d="M300 52 C 270 52, 250 60, 228 84" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="304" y="56" font-size="12" font-weight="700" fill="#15803d">push</text>
  <path d="M228 100 C 250 110, 270 118, 300 118" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="304" y="122" font-size="12" font-weight="700" fill="#b91c1c">pop</text>
  <text x="160" y="220" text-anchor="middle" font-size="12" fill="#475569">add and remove at the SAME end</text>
  <line x1="360" y1="30" x2="360" y2="240" stroke="#e2e8f0" stroke-width="2"/>
  <text x="540" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0891b2">Queue · FIFO</text>
  <g text-anchor="middle">
    <text x="420" y="130" font-size="30">🧑</text><text x="470" y="130" font-size="30">👩</text><text x="520" y="130" font-size="30">👨</text><text x="570" y="130" font-size="30">🧓</text>
    <rect x="610" y="90" width="70" height="60" rx="8" fill="#cffafe" stroke="#06b6d4" stroke-width="2"/><text x="645" y="126" font-size="13" font-weight="700" fill="#155e75">☕ desk</text>
  </g>
  <path d="M390 170 H600" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="400" y="190" font-size="12" fill="#15803d">enqueue (back)</text>
  <text x="600" y="190" text-anchor="end" font-size="12" fill="#b91c1c">dequeue (front)</text>
  <text x="540" y="220" text-anchor="middle" font-size="12" fill="#475569">add at the back, remove from the front</text>
</svg>
