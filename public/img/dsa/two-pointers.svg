<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="720" height="200" fill="#ffffff"/>
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Find two numbers that sum to 10 (sorted array)</text>
  <g font-family="Consolas, monospace" font-size="22" font-weight="700" text-anchor="middle">
    <g transform="translate(120 60)">
      <rect width="80" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="40" y="39" fill="#334155">1</text>
      <rect x="84" width="80" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="124" y="39" fill="#334155">3</text>
      <rect x="168" width="80" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="208" y="39" fill="#14532d">4</text>
      <rect x="252" width="80" height="60" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/><text x="292" y="39" fill="#14532d">6</text>
      <rect x="336" width="80" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="376" y="39" fill="#334155">8</text>
      <rect x="420" width="80" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="460" y="39" fill="#334155">11</text>
    </g>
  </g>
  <g font-size="14" font-weight="800" text-anchor="middle">
    <text x="160" y="150" fill="#2563eb">L</text><path d="M180 145 H300" stroke="#2563eb" stroke-width="3" stroke-dasharray="6 5"/><path d="M298 138 l12 7 -12 7z" fill="#2563eb"/>
    <text x="580" y="150" fill="#dc2626">R</text><path d="M560 145 H440" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/><path d="M442 138 l-12 7 12 7z" fill="#dc2626"/>
  </g>
  <text x="360" y="182" text-anchor="middle" font-size="13" fill="#475569">sum too small → L moves right · sum too big → R moves left · meet at 4 + 6 = 10</text>
</svg>
