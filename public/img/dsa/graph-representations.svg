<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="740" height="260" fill="#ffffff"/>
  <g stroke="#94a3b8" stroke-width="3"><line x1="60" y1="70" x2="160" y2="70"/><line x1="60" y1="70" x2="60" y2="180"/><line x1="160" y1="70" x2="160" y2="180"/><line x1="60" y1="180" x2="160" y2="180"/></g>
  <g font-weight="800" font-size="16" text-anchor="middle">
    <circle cx="60" cy="70" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/><text x="60" y="76" fill="#1e3a8a">A</text>
    <circle cx="160" cy="70" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/><text x="160" y="76" fill="#1e3a8a">B</text>
    <circle cx="60" cy="180" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/><text x="60" y="186" fill="#1e3a8a">C</text>
    <circle cx="160" cy="180" r="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.5"/><text x="160" y="186" fill="#1e3a8a">D</text>
  </g>
  <text x="110" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">Graph</text>
  <text x="340" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#047857">Adjacency list</text>
  <g font-family="Consolas, monospace" font-size="14">
    <g transform="translate(250 56)"><rect width="36" height="30" rx="5" fill="#dcfce7" stroke="#22c55e"/><text x="12" y="20" fill="#14532d" font-weight="700">A</text><text x="48" y="20" fill="#334155">→ [B, C]</text></g>
    <g transform="translate(250 96)"><rect width="36" height="30" rx="5" fill="#dcfce7" stroke="#22c55e"/><text x="12" y="20" fill="#14532d" font-weight="700">B</text><text x="48" y="20" fill="#334155">→ [A, D]</text></g>
    <g transform="translate(250 136)"><rect width="36" height="30" rx="5" fill="#dcfce7" stroke="#22c55e"/><text x="12" y="20" fill="#14532d" font-weight="700">C</text><text x="48" y="20" fill="#334155">→ [A, D]</text></g>
    <g transform="translate(250 176)"><rect width="36" height="30" rx="5" fill="#dcfce7" stroke="#22c55e"/><text x="12" y="20" fill="#14532d" font-weight="700">D</text><text x="48" y="20" fill="#334155">→ [B, C]</text></g>
  </g>
  <text x="340" y="232" text-anchor="middle" font-size="12" fill="#15803d">stores only real edges</text>
  <text x="600" y="36" text-anchor="middle" font-size="14" font-weight="800" fill="#7c3aed">Adjacency matrix</text>
  <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
    <g fill="#64748b" font-weight="700"><text x="550" y="70">A</text><text x="590" y="70">B</text><text x="630" y="70">C</text><text x="670" y="70">D</text><text x="515" y="100">A</text><text x="515" y="140">B</text><text x="515" y="180">C</text><text x="515" y="220">D</text></g>
    <g transform="translate(530 78)">
      <g fill="#f5f3ff" stroke="#c4b5fd">
        <rect width="40" height="40"/><rect x="40" width="40" height="40" fill="#ddd6fe"/><rect x="80" width="40" height="40" fill="#ddd6fe"/><rect x="120" width="40" height="40"/>
        <rect y="40" width="40" height="40" fill="#ddd6fe"/><rect x="40" y="40" width="40" height="40"/><rect x="80" y="40" width="40" height="40"/><rect x="120" y="40" width="40" height="40" fill="#ddd6fe"/>
        <rect y="80" width="40" height="40" fill="#ddd6fe"/><rect x="40" y="80" width="40" height="40"/><rect x="80" y="80" width="40" height="40"/><rect x="120" y="80" width="40" height="40" fill="#ddd6fe"/>
        <rect y="120" width="40" height="40"/><rect x="40" y="120" width="40" height="40" fill="#ddd6fe"/><rect x="80" y="120" width="40" height="40" fill="#ddd6fe"/><rect x="120" y="120" width="40" height="40"/>
      </g>
      <g fill="#4c1d95">
        <text x="20" y="26">0</text><text x="60" y="26">1</text><text x="100" y="26">1</text><text x="140" y="26">0</text>
        <text x="20" y="66">1</text><text x="60" y="66">0</text><text x="100" y="66">0</text><text x="140" y="66">1</text>
        <text x="20" y="106">1</text><text x="60" y="106">0</text><text x="100" y="106">0</text><text x="140" y="106">1</text>
        <text x="20" y="146">0</text><text x="60" y="146">1</text><text x="100" y="146">1</text><text x="140" y="146">0</text>
      </g>
    </g>
  </g>
  <text x="610" y="254" text-anchor="middle" font-size="12" fill="#6d28d9">V × V cells, even for missing edges</text>
</svg>
