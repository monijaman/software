<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="300" y1="50" x2="190" y2="130"/><line x1="300" y1="50" x2="410" y2="130"/>
    <line x1="190" y1="130" x2="120" y2="220"/><line x1="190" y1="130" x2="260" y2="220"/><line x1="410" y1="130" x2="480" y2="220"/>
  </g>
  <g font-weight="800" font-size="18" text-anchor="middle">
    <circle cx="300" cy="50" r="26" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/><text x="300" y="56" fill="#78350f">A</text>
    <circle cx="190" cy="130" r="26" fill="#bfdbfe" stroke="#3b82f6" stroke-width="3"/><text x="190" y="136" fill="#1e3a8a">B</text>
    <circle cx="410" cy="130" r="26" fill="#bfdbfe" stroke="#3b82f6" stroke-width="3"/><text x="410" y="136" fill="#1e3a8a">C</text>
    <circle cx="120" cy="220" r="26" fill="#bbf7d0" stroke="#22c55e" stroke-width="3"/><text x="120" y="226" fill="#14532d">D</text>
    <circle cx="260" cy="220" r="26" fill="#bbf7d0" stroke="#22c55e" stroke-width="3"/><text x="260" y="226" fill="#14532d">E</text>
    <circle cx="480" cy="220" r="26" fill="#bbf7d0" stroke="#22c55e" stroke-width="3"/><text x="480" y="226" fill="#14532d">F</text>
  </g>
  <g font-size="13" font-weight="700">
    <text x="336" y="42" fill="#b45309">← root (depth 0)</text>
    <text x="20" y="86" fill="#1d4ed8">B is the parent of D and E</text>
    <text x="446" y="126" fill="#1d4ed8">← internal node</text>
    <text x="120" y="272" text-anchor="middle" fill="#15803d">leaf</text><text x="260" y="272" text-anchor="middle" fill="#15803d">leaf</text><text x="480" y="272" text-anchor="middle" fill="#15803d">leaf</text>
  </g>
  <rect x="82" y="96" width="216" height="162" rx="16" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="200" y="292" text-anchor="middle" font-size="12" fill="#7c3aed">subtree rooted at B</text>
  <g transform="translate(560 40)">
    <line x1="20" y1="10" x2="20" y2="180" stroke="#475569" stroke-width="2"/>
    <g font-size="12" fill="#334155"><text x="30" y="16">depth 0</text><text x="30" y="96">depth 1</text><text x="30" y="186">depth 2</text></g>
    <text x="0" y="212" font-size="13" font-weight="800" fill="#0f172a">height = 2</text>
  </g>
