<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="720" height="300" fill="#ffffff"/>
  <g stroke="#94a3b8" stroke-width="3">
    <line x1="200" y1="45" x2="120" y2="115"/><line x1="200" y1="45" x2="280" y2="115"/>
    <line x1="120" y1="115" x2="70" y2="185"/><line x1="120" y1="115" x2="170" y2="185"/><line x1="280" y1="115" x2="230" y2="185"/>
  </g>
  <g font-weight="800" font-size="17" text-anchor="middle">
    <circle cx="200" cy="45" r="24" fill="#fde68a" stroke="#f59e0b" stroke-width="3"/><text x="200" y="51" fill="#78350f">1</text>
    <circle cx="120" cy="115" r="24" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/><text x="120" y="121" fill="#312e81">3</text>
    <circle cx="280" cy="115" r="24" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/><text x="280" y="121" fill="#312e81">5</text>
    <circle cx="70" cy="185" r="24" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/><text x="70" y="191" fill="#312e81">9</text>
    <circle cx="170" cy="185" r="24" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/><text x="170" y="191" fill="#312e81">4</text>
    <circle cx="230" cy="185" r="24" fill="#e0e7ff" stroke="#6366f1" stroke-width="2.5"/><text x="230" y="191" fill="#312e81">8</text>
  </g>
  <g font-size="11" fill="#64748b" text-anchor="middle"><text x="200" y="14">i=0</text><text x="88" y="100">i=1</text><text x="312" y="100">i=2</text><text x="40" y="220">i=3</text><text x="170" y="226">i=4</text><text x="262" y="220">i=5</text></g>
  <text x="236" y="40" font-size="12" font-weight="700" fill="#b45309">← min is always here</text>
  <line x1="370" y1="30" x2="370" y2="230" stroke="#e2e8f0" stroke-width="2"/>
  <text x="545" y="60" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">Same heap as an array</text>
  <g font-family="Consolas, monospace" font-weight="700" text-anchor="middle" font-size="16">
    <g transform="translate(395 80)">
      <rect width="50" height="44" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/><text x="25" y="28" fill="#78350f">1</text>
      <rect x="50" width="50" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="75" y="28" fill="#312e81">3</text>
      <rect x="100" width="50" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="125" y="28" fill="#312e81">5</text>
      <rect x="150" width="50" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="175" y="28" fill="#312e81">9</text>
      <rect x="200" width="50" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="225" y="28" fill="#312e81">4</text>
      <rect x="250" width="50" height="44" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/><text x="275" y="28" fill="#312e81">8</text>
      <g font-size="11" fill="#64748b" font-weight="400"><text x="25" y="60">0</text><text x="75" y="60">1</text><text x="125" y="60">2</text><text x="175" y="60">3</text><text x="225" y="60">4</text><text x="275" y="60">5</text></g>
    </g>
  </g>
  <g fill="none" stroke="#6366f1" stroke-width="2"><path d="M470 146 C 480 176, 560 176, 570 146"/><path d="M470 146 C 490 196, 610 196, 620 146"/></g>
  <text x="545" y="216" text-anchor="middle" font-size="12" fill="#4338ca">children of i=1 are at 2·1+1 = 3 and 2·1+2 = 4</text>
  <text x="360" y="275" text-anchor="middle" font-size="13" fill="#475569">Every parent ≤ its children · no gaps · no pointers needed</text>
</svg>
