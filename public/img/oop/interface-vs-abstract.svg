<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>

  <!-- Interface -->
  <rect x="15" y="15" width="355" height="270" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="192" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">📋 Interface = a contract</text>
  <rect x="50" y="58" width="285" height="150" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="192" y="82" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a" font-family="Consolas, monospace">interface Notifier</text>
  <line x1="62" y1="92" x2="323" y2="92" stroke="#bfdbfe"/>
  <g font-size="12" fill="#1e40af" font-family="Consolas, monospace">
    <text x="70" y="116">☐ send(to, message)</text>
    <text x="70" y="140">☐ maxRetries: number</text>
  </g>
  <text x="192" y="172" text-anchor="middle" font-size="11" fill="#64748b">Only "what". No code, no state.</text>
  <text x="192" y="190" text-anchor="middle" font-size="11" fill="#64748b">Gone after compiling.</text>
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="224" width="95" height="26" rx="13" fill="#dbeafe"/><text x="87" y="241" fill="#1e3a8a">EmailNotifier</text>
    <rect x="145" y="224" width="95" height="26" rx="13" fill="#dbeafe"/><text x="192" y="241" fill="#1e3a8a">SlackNotifier</text>
    <rect x="250" y="224" width="95" height="26" rx="13" fill="#dbeafe"/><text x="297" y="241" fill="#1e3a8a">FakeNotifier</text>
  </g>
  <text x="192" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">A class can implement MANY interfaces</text>

  <!-- Abstract class -->
  <rect x="390" y="15" width="355" height="270" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="567" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">🏗️ Abstract class = half-built</text>
  <rect x="425" y="58" width="285" height="150" rx="10" fill="#fff" stroke="#f97316" stroke-width="2"/>
  <text x="567" y="82" text-anchor="middle" font-size="13" font-weight="800" fill="#7c2d12" font-family="Consolas, monospace">abstract class DataExporter</text>
  <line x1="437" y1="92" x2="698" y2="92" stroke="#fed7aa"/>
  <g font-size="12" font-family="Consolas, monospace">
    <rect x="440" y="100" width="255" height="22" rx="4" fill="#dcfce7"/>
    <text x="448" y="116" fill="#15803d">✔ fileName (state)</text>
    <rect x="440" y="126" width="255" height="22" rx="4" fill="#dcfce7"/>
    <text x="448" y="142" fill="#15803d">✔ export() { …shared code… }</text>
    <rect x="440" y="152" width="255" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="4 3"/>
    <text x="448" y="168" fill="#b45309">☐ abstract serialize()</text>
  </g>
  <text x="567" y="194" text-anchor="middle" font-size="11" fill="#64748b">✔ done for you   ☐ child must fill in</text>
  <g font-size="11" text-anchor="middle">
    <rect x="455" y="224" width="105" height="26" rx="13" fill="#ffedd5"/><text x="507" y="241" fill="#7c2d12">CsvExporter</text>
    <rect x="575" y="224" width="105" height="26" rx="13" fill="#ffedd5"/><text x="627" y="241" fill="#7c2d12">JsonExporter</text>
  </g>
  <text x="567" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">A class can extend only ONE parent</text>
</svg>
