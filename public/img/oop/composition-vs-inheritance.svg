<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#ffffff" stroke="#c2410c" stroke-width="1.5"/></marker>
  <marker id="dia" viewBox="0 0 16 10" refX="1" refY="5" markerWidth="14" markerHeight="9" orient="auto"><path d="M0 5 L8 0 L16 5 L8 10 z" fill="#15803d"/></marker></defs>
  <rect width="760" height="320" fill="#ffffff"/>

  <!-- Inheritance side -->
  <rect x="15" y="15" width="400" height="290" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="215" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">❌ Inheritance: a class per combination</text>
  <g font-size="11" text-anchor="middle">
    <rect x="160" y="58" width="110" height="30" rx="8" fill="#fff" stroke="#f97316" stroke-width="2"/><text x="215" y="78" font-weight="700" fill="#7c2d12">Character</text>
    <rect x="45" y="128" width="110" height="30" rx="8" fill="#fff" stroke="#f97316"/><text x="100" y="148" fill="#7c2d12">Flying</text>
    <rect x="160" y="128" width="110" height="30" rx="8" fill="#fff" stroke="#f97316"/><text x="215" y="148" fill="#7c2d12">Swimming</text>
    <rect x="275" y="128" width="110" height="30" rx="8" fill="#fff" stroke="#f97316"/><text x="330" y="148" fill="#7c2d12">Attacking</text>
    <rect x="30" y="198" width="120" height="30" rx="8" fill="#fff" stroke="#f97316"/><text x="90" y="218" fill="#7c2d12">FlyingSwimming</text>
    <rect x="155" y="198" width="120" height="30" rx="8" fill="#fff" stroke="#f97316"/><text x="215" y="218" fill="#7c2d12">FlyingAttacking</text>
    <rect x="280" y="198" width="125" height="30" rx="8" fill="#fff" stroke="#f97316"/><text x="342" y="218" fill="#7c2d12">SwimmingAttacking</text>
    <rect x="105" y="248" width="220" height="30" rx="8" fill="#fee2e2" stroke="#ef4444"/><text x="215" y="268" font-weight="700" fill="#b91c1c">FlyingSwimmingAttacking 😵</text>
  </g>
  <g stroke="#c2410c" stroke-width="1.5" fill="none" marker-end="url(#tri)">
    <line x1="100" y1="128" x2="200" y2="90"/>
    <line x1="215" y1="128" x2="215" y2="90"/>
    <line x1="330" y1="128" x2="230" y2="90"/>
    <line x1="90" y1="198" x2="100" y2="160"/>
    <line x1="215" y1="198" x2="110" y2="160"/>
    <line x1="342" y1="198" x2="225" y2="160"/>
    <line x1="215" y1="248" x2="95" y2="230"/>
  </g>
  <text x="215" y="296" text-anchor="middle" font-size="11" fill="#9a3412">3 abilities → 7+ classes, with copied code</text>

  <!-- Composition side -->
  <rect x="430" y="15" width="315" height="290" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="587" y="42" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">✅ Composition: plug in parts</text>
  <rect x="507" y="62" width="160" height="80" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2.5"/>
  <text x="587" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">🐉 Character</text>
  <text x="587" y="108" text-anchor="middle" font-size="11" fill="#166534">has a movement</text>
  <text x="587" y="126" text-anchor="middle" font-size="11" fill="#166534">has an attack</text>

  <g stroke="#15803d" stroke-width="1.5" fill="none">
    <line x1="545" y1="150" x2="510" y2="186" marker-start="url(#dia)"/>
    <line x1="630" y1="150" x2="665" y2="186" marker-start="url(#dia)"/>
  </g>
  <g font-size="11" text-anchor="middle">
    <text x="510" y="200" font-weight="700" fill="#166534">Movement</text>
    <rect x="455" y="208" width="110" height="24" rx="12" fill="#dcfce7" stroke="#22c55e"/><text x="510" y="224" fill="#14532d">🪽 Fly</text>
    <rect x="455" y="236" width="110" height="24" rx="12" fill="#dcfce7" stroke="#22c55e"/><text x="510" y="252" fill="#14532d">🌊 Swim</text>
    <rect x="455" y="264" width="110" height="24" rx="12" fill="#dcfce7" stroke="#22c55e"/><text x="510" y="280" fill="#14532d">🚶 Walk</text>
    <text x="665" y="200" font-weight="700" fill="#166534">Attack</text>
    <rect x="610" y="208" width="110" height="24" rx="12" fill="#dcfce7" stroke="#22c55e"/><text x="665" y="224" fill="#14532d">🔥 FireBreath</text>
    <rect x="610" y="236" width="110" height="24" rx="12" fill="#dcfce7" stroke="#22c55e"/><text x="665" y="252" fill="#14532d">🗡️ Sword</text>
    <rect x="610" y="264" width="110" height="24" rx="12" fill="#dcfce7" stroke="#22c55e"/><text x="665" y="280" fill="#14532d">🕊️ NoAttack</text>
  </g>
  <text x="587" y="300" text-anchor="middle" font-size="11" fill="#15803d">New ability = 1 small class, any mix</text>
</svg>
