<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M0 0 L12 6 L0 12 z" fill="#ffffff" stroke="#0e7490" stroke-width="1.5"/></marker></defs>
  <rect width="760" height="320" fill="#ffffff"/>

  <!-- Parent -->
  <g transform="translate(270 14)">
    <rect width="220" height="108" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2.5"/>
    <text x="110" y="24" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">PARENT (base class)</text>
    <text x="110" y="46" text-anchor="middle" font-size="16" font-weight="800" fill="#164e63">🐾 Animal</text>
    <line x1="10" y1="56" x2="210" y2="56" stroke="#67e8f9"/>
    <text x="22" y="76" font-size="12" fill="#155e75">name</text>
    <text x="22" y="96" font-size="12" fill="#155e75">eat()   speak()</text>
  </g>

  <!-- arrows: child to parent (UML generalization) -->
  <g stroke="#0e7490" stroke-width="2" fill="none" marker-end="url(#tri)">
    <path d="M130 196 L130 160 L380 160 L380 124"/>
    <path d="M380 196 L380 124"/>
    <path d="M630 196 L630 160 L380 160 L380 124"/>
  </g>
  <text x="520" y="152" font-size="11" font-weight="700" fill="#0e7490">extends ("is a")</text>

  <!-- Children -->
  <g font-size="12">
    <g transform="translate(25 196)">
      <rect width="210" height="110" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="105" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">🐕 Dog</text>
      <line x1="10" y1="36" x2="200" y2="36" stroke="#86efac"/>
      <text x="16" y="56" fill="#64748b">inherits: name, eat()</text>
      <text x="16" y="76" fill="#b45309">overrides: speak() → "Woof"</text>
      <text x="16" y="96" fill="#15803d">adds: fetch()</text>
    </g>
    <g transform="translate(275 196)">
      <rect width="210" height="110" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="105" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">🐈 Cat</text>
      <line x1="10" y1="36" x2="200" y2="36" stroke="#86efac"/>
      <text x="16" y="56" fill="#64748b">inherits: name, eat()</text>
      <text x="16" y="76" fill="#b45309">overrides: speak() → "Meow"</text>
      <text x="16" y="96" fill="#15803d">adds: climb()</text>
    </g>
    <g transform="translate(525 196)">
      <rect width="210" height="110" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="105" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">🐦 Bird</text>
      <line x1="10" y1="36" x2="200" y2="36" stroke="#86efac"/>
      <text x="16" y="56" fill="#64748b">inherits: name, eat()</text>
      <text x="16" y="76" fill="#b45309">overrides: speak() → "Tweet"</text>
      <text x="16" y="96" fill="#15803d">adds: wingspan</text>
    </g>
  </g>
</svg>
