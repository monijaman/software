<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <!-- roof -->
  <path d="M40 92 L380 22 L720 92 Z" fill="#fdf4ff" stroke="#c026d3" stroke-width="2"/>
  <text x="380" y="72" text-anchor="middle" font-size="18" font-weight="800" fill="#86198f">Object-Oriented Programming</text>
  <!-- pillars -->
  <g font-size="12" text-anchor="middle">
    <g transform="translate(60 100)">
      <rect width="140" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="70" y="40" font-size="30">💊</text>
      <text x="70" y="72" font-size="14" font-weight="800" fill="#1e40af">Encapsulation</text>
      <text x="70" y="96" fill="#334155">Hide the data,</text>
      <text x="70" y="112" fill="#334155">expose safe methods</text>
      <text x="70" y="136" font-size="11" fill="#64748b">🔒 private balance</text>
    </g>
    <g transform="translate(225 100)">
      <rect width="140" height="150" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
      <text x="70" y="40" font-size="30">🚗</text>
      <text x="70" y="72" font-size="14" font-weight="800" fill="#a16207">Abstraction</text>
      <text x="70" y="96" fill="#334155">Show what it does,</text>
      <text x="70" y="112" fill="#334155">hide how it works</text>
      <text x="70" y="136" font-size="11" fill="#64748b">pedals, not pistons</text>
    </g>
    <g transform="translate(390 100)">
      <rect width="140" height="150" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
      <text x="70" y="40" font-size="30">🌳</text>
      <text x="70" y="72" font-size="14" font-weight="800" fill="#0e7490">Inheritance</text>
      <text x="70" y="96" fill="#334155">Reuse a parent</text>
      <text x="70" y="112" fill="#334155">class's code</text>
      <text x="70" y="136" font-size="11" fill="#64748b">Dog is an Animal</text>
    </g>
    <g transform="translate(555 100)">
      <rect width="140" height="150" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="70" y="40" font-size="30">🎭</text>
      <text x="70" y="72" font-size="14" font-weight="800" fill="#15803d">Polymorphism</text>
      <text x="70" y="96" fill="#334155">Same call,</text>
      <text x="70" y="112" fill="#334155">different behavior</text>
      <text x="70" y="136" font-size="11" fill="#64748b">speak(): woof / meow</text>
    </g>
  </g>
  <!-- base -->
  <rect x="40" y="256" width="680" height="30" rx="6" fill="#f5d0fe" stroke="#c026d3" stroke-width="2"/>
  <text x="380" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#701a75">Classes and objects: data + behavior together</text>
</svg>
