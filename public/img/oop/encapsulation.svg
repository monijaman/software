<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ef4444"/></marker></defs>
  <rect width="760" height="290" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Encapsulation: locked data, public buttons</text>

  <!-- Outside code -->
  <g font-size="12">
    <rect x="20" y="70" width="150" height="48" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="95" y="99" text-anchor="middle" font-weight="700" fill="#334155">👩‍💻 Checkout code</text>
    <rect x="20" y="178" width="150" height="48" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="95" y="207" text-anchor="middle" font-weight="700" fill="#334155">🐞 Buggy code</text>
  </g>

  <!-- Object shell -->
  <rect x="260" y="44" width="470" height="228" rx="24" fill="#fdf4ff" stroke="#c026d3" stroke-width="3"/>
  <text x="495" y="70" text-anchor="middle" font-size="15" font-weight="800" fill="#86198f">BankAccount object</text>

  <!-- Public buttons -->
  <g font-size="12" text-anchor="middle">
    <rect x="280" y="88" width="130" height="34" rx="17" fill="#f5d0fe" stroke="#c026d3"/>
    <text x="345" y="110" font-weight="700" fill="#701a75">deposit(100)</text>
    <rect x="280" y="134" width="130" height="34" rx="17" fill="#f5d0fe" stroke="#c026d3"/>
    <text x="345" y="156" font-weight="700" fill="#701a75">withdraw(40)</text>
    <rect x="280" y="180" width="130" height="34" rx="17" fill="#f5d0fe" stroke="#c026d3"/>
    <text x="345" y="202" font-weight="700" fill="#701a75">get balance</text>
    <text x="345" y="240" font-size="11" fill="#a21caf">public interface</text>
  </g>

  <!-- Private vault -->
  <rect x="450" y="88" width="260" height="160" rx="16" fill="#1e293b"/>
  <text x="580" y="116" text-anchor="middle" font-size="13" font-weight="800" fill="#f5d0fe">🔒 private</text>
  <g font-size="13" fill="#e2e8f0">
    <text x="475" y="148">#balance = 60</text>
    <text x="475" y="174">#history = ["+100", "-40"]</text>
  </g>
  <text x="580" y="208" text-anchor="middle" font-size="11" fill="#cbd5e1">Rules checked here:</text>
  <text x="580" y="226" text-anchor="middle" font-size="11" fill="#cbd5e1">amount &gt; 0, balance never below 0</text>

  <!-- arrows -->
  <line x1="170" y1="94" x2="278" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="170" y1="100" x2="278" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="105" x2="448" y2="140" stroke="#a21caf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="151" x2="448" y2="160" stroke="#a21caf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="197" x2="448" y2="180" stroke="#a21caf" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M170 210 C 215 230, 240 225, 256 215" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrRed)"/>
  <text x="125" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">acc.#balance = -999</text>
  <text x="125" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626">❌ blocked at the wall</text>
</svg>
