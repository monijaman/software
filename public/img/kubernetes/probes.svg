<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="250" fill="#ffffff"/>
  <g text-anchor="middle">
    <g transform="translate(190 20)">
      <rect x="-170" width="340" height="210" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text y="34" font-size="16" font-weight="800" fill="#991b1b">❤️ Liveness probe</text>
      <text y="56" font-size="12" fill="#7f1d1d">“Are you alive?”</text>
      <g transform="translate(-80 110)"><rect x="-40" y="-30" width="80" height="60" rx="10" fill="#fff" stroke="#ef4444" stroke-dasharray="5 4"/><text y="6" font-size="24">😵</text><text y="46" font-size="11" fill="#7f1d1d">stuck</text></g>
      <text y="116" font-size="22" fill="#94a3b8">→</text>
      <g transform="translate(80 110)"><rect x="-40" y="-30" width="80" height="60" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><text y="6" font-size="24">🙂</text><text y="46" font-size="11" fill="#15803d">fresh</text></g>
      <text y="190" font-size="13" font-weight="700" fill="#991b1b">fails → container RESTARTED 🔁</text>
    </g>
    <g transform="translate(570 20)">
      <rect x="-170" width="340" height="210" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text y="34" font-size="16" font-weight="800" fill="#1e3a8a">🚦 Readiness probe</text>
      <text y="56" font-size="12" fill="#1e40af">“Can you take traffic right now?”</text>
      <g transform="translate(-100 110)"><path d="M-40 -18 H30 L40 0 L30 18 H-40 Z" fill="#dbeafe" stroke="#3b82f6"/><text x="-4" y="4" font-size="11" font-weight="700" fill="#1e3a8a">Service</text></g>
      <g transform="translate(40 88)"><rect x="-34" y="-16" width="68" height="32" rx="8" fill="#dcfce7" stroke="#22c55e"/><text y="5" font-size="11" fill="#14532d">✅ ready</text></g>
      <g transform="translate(40 136)"><rect x="-34" y="-16" width="68" height="32" rx="8" fill="#fef3c7" stroke="#f59e0b"/><text y="5" font-size="11" fill="#78350f">⏳ warming</text></g>
      <path d="M-60 104 L6 90" stroke="#22c55e" stroke-width="2.5"/>
      <path d="M-60 116 L6 134" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 3"/>
      <text y="190" font-size="13" font-weight="700" fill="#1e3a8a">fails → no traffic, NOT restarted</text>
    </g>
  </g>
</svg>
