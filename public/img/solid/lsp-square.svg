<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="720" height="250" fill="#ffffff"/>
  <text x="185" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#047857">Rectangle ✅</text>
  <text x="535" y="30" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">Square ❌</text>
  <g font-family="Consolas, monospace" font-size="12" fill="#334155">
    <text x="40" y="60">setWidth(5); setHeight(4);</text>
    <text x="390" y="60">setWidth(5); setHeight(4);</text>
  </g>
  <rect x="85" y="80" width="200" height="120" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  <text x="185" y="147" text-anchor="middle" font-size="22" font-weight="800" fill="#14532d">5 × 4 = 20</text>
  <text x="185" y="222" text-anchor="middle" font-size="12" fill="#166534">width stays 5 when height changes</text>
  <line x1="360" y1="45" x2="360" y2="230" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="435" y="80" width="200" height="120" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="640" y="78" font-size="11" fill="#ef4444">expected</text>
  <rect x="475" y="80" width="120" height="120" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/>
  <text x="535" y="147" text-anchor="middle" font-size="22" font-weight="800" fill="#7f1d1d">4 × 4 = 16</text>
  <text x="535" y="222" text-anchor="middle" font-size="12" fill="#991b1b">setHeight(4) silently changed width!</text>
</svg>
