<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="Segoe UI,system-ui,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs><rect width="800" height="400" fill="#fff"/><text x="32" y="36" font-size="22" font-weight="800" fill="#1e293b">From one mixed table to facts with clear owners</text><g font-size="12"><rect x="35" y="72" width="205" height="210" rx="14" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="52" y="99" font-weight="800" fill="#9f1239">Before: order_items_mixed</text><text x="52" y="126" fill="#475569">order_id, customer_name</text><text x="52" y="150" fill="#475569">customer_email, product_name</text><text x="52" y="174" fill="#475569">product_price, quantity</text><text x="52" y="215" fill="#9f1239" font-weight="700">Customer and product facts repeat</text><text x="52" y="239" fill="#9f1239" font-weight="700">Partial and transitive dependencies</text><line x1="250" y1="177" x2="315" y2="177" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><text x="265" y="158" fill="#0f766e" font-weight="800">1NF → 3NF</text><g><rect x="335" y="72" width="180" height="82" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="350" y="99" font-weight="800" fill="#1e3a8a">customers</text><text x="350" y="125" fill="#475569">customer_id PK</text><text x="350" y="145" fill="#475569">name, email UNIQUE</text><rect x="335" y="186" width="180" height="82" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="350" y="213" font-weight="800" fill="#5b21b6">orders</text><text x="350" y="239" fill="#475569">order_id PK, customer_id FK</text><text x="350" y="259" fill="#475569">ordered_at, status</text><rect x="560" y="72" width="180" height="82" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="575" y="99" font-weight="800" fill="#115e59">products</text><text x="575" y="125" fill="#475569">product_id PK</text><text x="575" y="145" fill="#475569">name, current_price</text><rect x="560" y="186" width="180" height="82" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="575" y="213" font-weight="800" fill="#9a3412">order_items</text><text x="575" y="239" fill="#475569">order_id FK, product_id FK</text><text x="575" y="259" fill="#475569">quantity, price_at_purchase</text></g><g stroke="#64748b" stroke-width="2" marker-end="url(#a)"><line x1="425" y1="154" x2="425" y2="181"/><line x1="515" y1="227" x2="555" y2="227"/></g><text x="400" y="342" font-size="13" fill="#475569">Each table owns one kind of fact. Foreign keys preserve the links.</text></g></svg>