<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="270" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Where does a "slow query" really spend its time?</text>

  <!-- Case A: execution heavy -->
  <text x="20" y="62" font-size="12" font-weight="700" fill="#334155">A. Slow SQL</text>
  <g transform="translate(130 46)">
    <rect x="0" width="30" height="26" fill="#bfdbfe"/>
    <rect x="30" width="20" height="26" fill="#fde68a"/>
    <rect x="50" width="520" height="26" fill="#fca5a5"/>
    <rect x="570" width="40" height="26" fill="#d9f99d"/>
    <text x="310" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">execution 1,200 ms → fix the SQL / index</text>
  </g>

  <!-- Case B: lock heavy -->
  <text x="20" y="112" font-size="12" font-weight="700" fill="#334155">B. Blocked</text>
  <g transform="translate(130 96)">
    <rect x="0" width="30" height="26" fill="#bfdbfe"/>
    <rect x="30" width="520" height="26" fill="#fde68a"/>
    <rect x="550" width="20" height="26" fill="#fca5a5"/>
    <rect x="570" width="40" height="26" fill="#d9f99d"/>
    <text x="290" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">lock wait 1,200 ms → find the blocking transaction</text>
  </g>

  <!-- Case C: pool heavy -->
  <text x="20" y="162" font-size="12" font-weight="700" fill="#334155">C. Pool queue</text>
  <g transform="translate(130 146)">
    <rect x="0" width="520" height="26" fill="#bfdbfe"/>
    <rect x="520" width="20" height="26" fill="#fde68a"/>
    <rect x="540" width="30" height="26" fill="#fca5a5"/>
    <rect x="570" width="40" height="26" fill="#d9f99d"/>
    <text x="260" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">waiting for a connection 1,200 ms → pool / long transactions</text>
  </g>

  <!-- legend -->
  <g font-size="12" transform="translate(130 196)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#bfdbfe"/><text x="22" y="13" fill="#334155">pool wait</text>
    <rect x="110" y="0" width="16" height="16" rx="3" fill="#fde68a"/><text x="132" y="13" fill="#334155">lock wait</text>
    <rect x="220" y="0" width="16" height="16" rx="3" fill="#fca5a5"/><text x="242" y="13" fill="#334155">execution</text>
    <rect x="330" y="0" width="16" height="16" rx="3" fill="#d9f99d"/><text x="352" y="13" fill="#334155">sending rows</text>
  </g>
  <text x="380" y="248" text-anchor="middle" font-size="12" fill="#475569">All three look like "1.3 s query" in the app. Only case A is fixed by EXPLAIN and indexes.</text>
</svg>
