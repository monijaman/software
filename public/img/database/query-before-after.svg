<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Before and after: one composite index</text>

  <!-- Before -->
  <rect x="15" y="44" width="355" height="240" rx="16" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="192" y="70" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">❌ Before: Seq Scan</text>
  <!-- grid of rows, all scanned -->
  <g fill="#fca5a5">
    <rect x="40" y="86" width="305" height="8" rx="2"/><rect x="40" y="98" width="305" height="8" rx="2"/>
    <rect x="40" y="110" width="305" height="8" rx="2"/><rect x="40" y="122" width="305" height="8" rx="2"/>
    <rect x="40" y="134" width="305" height="8" rx="2"/><rect x="40" y="146" width="305" height="8" rx="2"/>
    <rect x="40" y="158" width="305" height="8" rx="2"/><rect x="40" y="170" width="305" height="8" rx="2"/>
  </g>
  <text x="192" y="200" text-anchor="middle" font-size="12" fill="#7f1d1d">reads all 2,000,000 rows → sorts 61,240 → returns 50</text>
  <text x="192" y="240" text-anchor="middle" font-size="30" font-weight="800" fill="#b91c1c">1,244 ms</text>
  <text x="192" y="264" text-anchor="middle" font-size="11" fill="#7f1d1d">endpoint p95: 1.4 s</text>

  <!-- arrow -->
  <line x1="372" y1="164" x2="388" y2="164" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- After -->
  <rect x="390" y="44" width="355" height="240" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="567" y="70" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">✅ After: Index Scan</text>
  <g>
    <rect x="415" y="86" width="305" height="8" rx="2" fill="#e2e8f0"/><rect x="415" y="98" width="305" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="415" y="110" width="305" height="8" rx="2" fill="#22c55e"/><rect x="415" y="122" width="305" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="415" y="134" width="305" height="8" rx="2" fill="#e2e8f0"/><rect x="415" y="146" width="305" height="8" rx="2" fill="#e2e8f0"/>
    <rect x="415" y="158" width="305" height="8" rx="2" fill="#e2e8f0"/><rect x="415" y="170" width="305" height="8" rx="2" fill="#e2e8f0"/>
  </g>
  <text x="567" y="200" text-anchor="middle" font-size="12" fill="#166534">jumps to newest PAID rows → reads 50 → done</text>
  <text x="567" y="240" text-anchor="middle" font-size="30" font-weight="800" fill="#15803d">0.48 ms</text>
  <text x="567" y="264" text-anchor="middle" font-size="11" fill="#166534">endpoint p95: 45 ms · index on (status, created_at DESC)</text>
</svg>
