<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="400" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Reading EXPLAIN ANALYZE: find the step that costs the most</text>

  <!-- terminal -->
  <rect x="15" y="40" width="500" height="345" rx="12" fill="#0f172a"/>
  <circle cx="35" cy="56" r="5" fill="#ef4444"/><circle cx="51" cy="56" r="5" fill="#eab308"/><circle cx="67" cy="56" r="5" fill="#22c55e"/>
  <g font-family="Consolas, Menlo, monospace" font-size="11" fill="#e2e8f0">
    <text x="28" y="86">Limit  (actual time=1243.8..1243.9 rows=50)</text>
    <text x="28" y="106">  -&gt; Sort  (actual time=1243.8 rows=50)</text>
    <text x="28" y="122" fill="#94a3b8">       Sort Key: o.created_at DESC</text>
    <text x="28" y="142">     -&gt; Hash Join  (actual time=41.2..1198.5 rows=61240)</text>
    <text x="28" y="158" fill="#94a3b8">          Hash Cond: (o.customer_id = c.id)</text>
    <!-- hot line -->
    <rect x="22" y="166" width="486" height="20" rx="3" fill="#7f1d1d"/>
    <text x="28" y="180" fill="#fecaca" font-weight="700">        -&gt; Seq Scan on orders o</text>
    <text x="28" y="198">             (rows=<tspan fill="#fde68a">49924</tspan>) (actual time=0.03..<tspan fill="#fca5a5" font-weight="700">1102.7</tspan></text>
    <text x="28" y="214">              rows=<tspan fill="#fde68a">61240</tspan>)</text>
    <text x="28" y="232" fill="#94a3b8">             Filter: (status = 'PAID' AND created_at &gt;= ...)</text>
    <text x="28" y="250" fill="#fca5a5">             Rows Removed by Filter: 1938760</text>
    <text x="28" y="270">        -&gt; Hash  (actual time=40.9 rows=100000)</text>
    <text x="28" y="286">             -&gt; Seq Scan on customers c  (rows=100000)</text>
    <text x="28" y="316" fill="#94a3b8">Planning Time: 0.4 ms</text>
    <text x="28" y="336" fill="#fca5a5" font-weight="700">Execution Time: 1244.1 ms</text>
    <text x="28" y="368" fill="#64748b">read from the deepest indented line outward ↑</text>
  </g>

  <!-- callouts -->
  <g font-size="12">
    <g transform="translate(530 70)">
      <rect width="215" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="12" y="22" font-weight="800" fill="#b91c1c">① Seq Scan on a big table</text>
      <text x="12" y="40" fill="#334155">Reads every row of orders.</text>
      <text x="12" y="56" fill="#334155">1,102 of 1,244 ms are spent here.</text>
    </g>
    <line x1="530" y1="110" x2="510" y2="176" stroke="#ef4444" stroke-width="1.5"/>

    <g transform="translate(530 148)">
      <rect width="215" height="64" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
      <text x="12" y="22" font-weight="800" fill="#a16207">② Estimated vs actual rows</text>
      <text x="12" y="40" fill="#334155">49,924 vs 61,240: close enough.</text>
      <text x="12" y="56" fill="#334155">10× off? Run ANALYZE.</text>
    </g>
    <line x1="530" y1="190" x2="400" y2="206" stroke="#eab308" stroke-width="1.5"/>

    <g transform="translate(530 226)">
      <rect width="215" height="64" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <text x="12" y="22" font-weight="800" fill="#c2410c">③ Rows Removed by Filter</text>
      <text x="12" y="40" fill="#334155">Read 2M rows, kept 61k (3%).</text>
      <text x="12" y="56" fill="#334155">An index can skip the other 97%.</text>
    </g>
    <line x1="530" y1="258" x2="430" y2="248" stroke="#f97316" stroke-width="1.5"/>

    <g transform="translate(530 304)">
      <rect width="215" height="64" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="12" y="22" font-weight="800" fill="#5b21b6">④ Sort before LIMIT 50</text>
      <text x="12" y="40" fill="#334155">Sorts 61k rows to return 50.</text>
      <text x="12" y="56" fill="#334155">An ordered index avoids it.</text>
    </g>
    <line x1="530" y1="330" x2="300" y2="110" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
</svg>
