<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="hold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#15803d"/></marker>
    <marker id="wait" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Deadlock: each transaction waits for a lock the other holds</text>

  <!-- Transactions -->
  <g transform="translate(40 70)">
    <rect width="180" height="90" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
    <text x="90" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">Transaction A</text>
    <text x="90" y="52" text-anchor="middle" font-size="12" fill="#334155">Ana → Ben: $50</text>
    <text x="90" y="74" text-anchor="middle" font-size="11" fill="#64748b">⏳ waiting…</text>
  </g>
  <g transform="translate(540 70)">
    <rect width="180" height="90" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
    <text x="90" y="30" text-anchor="middle" font-size="15" font-weight="800" fill="#c2410c">Transaction B</text>
    <text x="90" y="52" text-anchor="middle" font-size="12" fill="#334155">Ben → Ana: $30</text>
    <text x="90" y="74" text-anchor="middle" font-size="11" fill="#64748b">⏳ waiting…</text>
  </g>

  <!-- Rows -->
  <g transform="translate(40 220)">
    <rect width="180" height="64" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">🔒 Row 1</text>
    <text x="90" y="48" text-anchor="middle" font-size="11" fill="#475569">accounts.id = 1 (Ana)</text>
  </g>
  <g transform="translate(540 220)">
    <rect width="180" height="64" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">🔒 Row 2</text>
    <text x="90" y="48" text-anchor="middle" font-size="11" fill="#475569">accounts.id = 2 (Ben)</text>
  </g>

  <!-- holds: row -> txn (green, vertical) -->
  <line x1="130" y1="218" x2="130" y2="164" stroke="#15803d" stroke-width="3" marker-end="url(#hold)"/>
  <text x="140" y="196" font-size="12" font-weight="700" fill="#15803d">held by A</text>
  <line x1="630" y1="218" x2="630" y2="164" stroke="#15803d" stroke-width="3" marker-end="url(#hold)"/>
  <text x="620" y="196" text-anchor="end" font-size="12" font-weight="700" fill="#15803d">held by B</text>

  <!-- waits: txn -> other row (red, crossing) -->
  <path d="M220 130 C 380 150, 420 200, 538 240" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#wait)"/>
  <path d="M540 130 C 380 150, 340 200, 222 240" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#wait)"/>
  <text x="300" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">A wants row 2</text>
  <text x="460" y="132" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">B wants row 1</text>

  <!-- cycle badge -->
  <circle cx="380" cy="190" r="26" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="198" text-anchor="middle" font-size="22">🔁</text>

  <!-- footer -->
  <rect x="140" y="296" width="480" height="26" rx="13" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="380" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">💥 Cycle detected → the database aborts one transaction (the victim)</text>
</svg>
