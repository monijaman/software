<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="320" fill="#ffffff"/>
  <!-- root -->
  <rect x="330" y="14" width="100" height="40" rx="10" fill="#1e293b"/>
  <text x="380" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#fde68a" font-family="Consolas, monospace">/</text>
  <!-- trunk -->
  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <line x1="380" y1="54" x2="380" y2="76"/>
    <line x1="70" y1="76" x2="690" y2="76"/>
    <line x1="70" y1="76" x2="70" y2="92"/><line x1="194" y1="76" x2="194" y2="92"/><line x1="318" y1="76" x2="318" y2="92"/>
    <line x1="442" y1="76" x2="442" y2="92"/><line x1="566" y1="76" x2="566" y2="92"/><line x1="690" y1="76" x2="690" y2="92"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <g transform="translate(15 92)">
      <rect width="110" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="55" y="26" font-size="15" font-weight="800" fill="#1e40af" font-family="Consolas, monospace">/etc</text>
      <text x="55" y="46" fill="#334155">⚙️ configuration</text>
    </g>
    <g transform="translate(139 92)">
      <rect width="110" height="70" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <text x="55" y="26" font-size="15" font-weight="800" fill="#c2410c" font-family="Consolas, monospace">/var</text>
      <text x="55" y="46" fill="#334155">📜 logs, websites</text>
    </g>
    <g transform="translate(263 92)">
      <rect width="110" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="55" y="26" font-size="15" font-weight="800" fill="#15803d" font-family="Consolas, monospace">/home</text>
      <text x="55" y="46" fill="#334155">🏠 users' files</text>
    </g>
    <g transform="translate(387 92)">
      <rect width="110" height="70" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="55" y="26" font-size="15" font-weight="800" fill="#5b21b6" font-family="Consolas, monospace">/usr</text>
      <text x="55" y="46" fill="#334155">📦 programs</text>
    </g>
    <g transform="translate(511 92)">
      <rect width="110" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <text x="55" y="26" font-size="15" font-weight="800" fill="#334155" font-family="Consolas, monospace">/tmp</text>
      <text x="55" y="46" fill="#334155">🗑️ temporary</text>
    </g>
    <g transform="translate(635 92)">
      <rect width="110" height="70" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text x="55" y="26" font-size="15" font-weight="800" fill="#b91c1c" font-family="Consolas, monospace">/root</text>
      <text x="55" y="46" fill="#334155">👑 admin's home</text>
    </g>
  </g>
  <!-- children -->
  <g stroke="#cbd5e1" stroke-width="1.5" fill="none">
    <path d="M70 162 V 300"/><path d="M194 162 V 300"/><path d="M318 162 V 240"/><path d="M442 162 V 240"/>
  </g>
  <g font-size="11" font-family="Consolas, monospace" fill="#334155">
    <g transform="translate(78 0)">
      <text y="190">├ nginx/</text><text y="210">├ systemd/system/</text><text y="230">├ ssh/sshd_config</text><text y="250">├ hosts</text><text y="270">└ os-release</text>
    </g>
    <g transform="translate(202 0)">
      <text y="190">├ log/</text><text y="208" fill="#64748b">│  ├ nginx/</text><text y="226" fill="#64748b">│  └ syslog</text><text y="248">├ www/</text><text y="266" fill="#64748b">│  └ myapp/</text><text y="288">└ lib/</text>
    </g>
    <g transform="translate(326 0)">
      <text y="190">├ deploy/</text><text y="208" fill="#64748b">│  └ .ssh/</text><text y="230">└ ana/</text>
    </g>
    <g transform="translate(450 0)">
      <text y="190">├ bin/ (node, git)</text><text y="210">├ local/bin/</text><text y="230">└ share/</text>
    </g>
  </g>
  <text x="640" y="200" font-size="11" fill="#64748b" text-anchor="middle">cleared on reboot</text>
  <text x="690" y="230" font-size="11" fill="#b91c1c" text-anchor="middle">avoid working here</text>
  <text x="600" y="290" font-size="11" fill="#475569" text-anchor="middle">~ = your home folder, e.g. /home/deploy</text>
</svg>
