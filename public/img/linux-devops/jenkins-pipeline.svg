<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">From Jenkinsfile to stage view</text>

  <g transform="translate(15 44)">
    <rect width="270" height="240" rx="12" fill="#0f172a"/>
    <g font-size="11" font-family="Consolas, monospace">
      <text x="14" y="24" fill="#f472b6">pipeline {</text>
      <text x="26" y="44" fill="#93c5fd">agent <tspan fill="#e2e8f0">any</tspan></text>
      <text x="26" y="64" fill="#93c5fd">stages {</text>
      <text x="38" y="84" fill="#fde68a">stage('Install') <tspan fill="#e2e8f0">{…}</tspan></text>
      <text x="38" y="104" fill="#fde68a">stage('Lint')    <tspan fill="#e2e8f0">{…}</tspan></text>
      <text x="38" y="124" fill="#fde68a">stage('Test')    <tspan fill="#e2e8f0">{…}</tspan></text>
      <text x="38" y="144" fill="#fde68a">stage('Build')   <tspan fill="#e2e8f0">{…}</tspan></text>
      <text x="26" y="164" fill="#93c5fd">}</text>
      <text x="26" y="184" fill="#86efac">post { success / failure</text>
      <text x="38" y="204" fill="#86efac">always { cleanWs() } }</text>
      <text x="14" y="224" fill="#f472b6">}</text>
    </g>
  </g>
  <line x1="290" y1="160" x2="320" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <g transform="translate(325 60)" font-size="11" text-anchor="middle">
    <rect width="420" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="210" y="22" font-size="12" font-weight="800" fill="#334155">Stage View: myapp » main</text>
    <g font-weight="700" fill="#475569">
      <text x="110" y="46">Install</text><text x="190" y="46">Lint</text><text x="270" y="46">Test</text><text x="350" y="46">Build</text>
    </g>
    <text x="38" y="80" font-weight="700" fill="#334155">#42</text>
    <rect x="76" y="62" width="68" height="28" rx="4" fill="#bbf7d0"/><text x="110" y="81" fill="#14532d">32s</text>
    <rect x="156" y="62" width="68" height="28" rx="4" fill="#bbf7d0"/><text x="190" y="81" fill="#14532d">8s</text>
    <rect x="236" y="62" width="68" height="28" rx="4" fill="#bbf7d0"/><text x="270" y="81" fill="#14532d">1m 10s</text>
    <rect x="316" y="62" width="68" height="28" rx="4" fill="#bbf7d0"/><text x="350" y="81" fill="#14532d">45s</text>
    <text x="38" y="118" font-weight="700" fill="#334155">#41</text>
    <rect x="76" y="100" width="68" height="28" rx="4" fill="#bbf7d0"/><text x="110" y="119" fill="#14532d">30s</text>
    <rect x="156" y="100" width="68" height="28" rx="4" fill="#bbf7d0"/><text x="190" y="119" fill="#14532d">7s</text>
    <rect x="236" y="100" width="68" height="28" rx="4" fill="#fecaca"/><text x="270" y="119" fill="#991b1b">failed</text>
    <rect x="316" y="100" width="68" height="28" rx="4" fill="#e2e8f0"/><text x="350" y="119" fill="#64748b">skipped</text>
    <text x="210" y="160" font-size="11" fill="#475569">Each stage is a column · each build is a row</text>
    <text x="210" y="180" font-size="11" fill="#475569">A failed stage stops the rest; post blocks still run</text>
  </g>
</svg>
