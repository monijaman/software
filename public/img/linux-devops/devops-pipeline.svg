<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="290" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">From git push to a live website, then back again</text>

  <g font-size="12" text-anchor="middle">
    <g transform="translate(15 55)">
      <rect width="110" height="120" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
      <text x="55" y="38" font-size="28">💻</text><text x="55" y="66" font-size="14" font-weight="800" fill="#334155">1. Code</text>
      <text x="55" y="88" fill="#475569">commit + push</text><text x="55" y="104" font-size="10" fill="#64748b">Git · GitHub</text>
    </g>
    <g transform="translate(140 55)">
      <rect width="110" height="120" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text x="55" y="38" font-size="28">🔨</text><text x="55" y="66" font-size="14" font-weight="800" fill="#1e40af">2. Build</text>
      <text x="55" y="88" fill="#475569">npm ci + build</text><text x="55" y="104" font-size="10" fill="#64748b">or docker build</text>
    </g>
    <g transform="translate(265 55)">
      <rect width="110" height="120" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="55" y="38" font-size="28">🧪</text><text x="55" y="66" font-size="14" font-weight="800" fill="#5b21b6">3. Test</text>
      <text x="55" y="88" fill="#475569">lint · unit · e2e</text><text x="55" y="104" font-size="10" fill="#64748b">fail = stop here</text>
    </g>
    <g transform="translate(390 55)">
      <rect width="110" height="120" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <text x="55" y="38" font-size="28">🚚</text><text x="55" y="66" font-size="14" font-weight="800" fill="#c2410c">4. Release</text>
      <text x="55" y="88" fill="#475569">copy to server</text><text x="55" y="104" font-size="10" fill="#64748b">SSH · registry</text>
    </g>
    <g transform="translate(515 55)">
      <rect width="110" height="120" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
      <text x="55" y="38" font-size="28">🐧</text><text x="55" y="66" font-size="14" font-weight="800" fill="#a16207">5. Run</text>
      <text x="55" y="88" fill="#475569">systemd + Nginx</text><text x="55" y="104" font-size="10" fill="#64748b">on Linux</text>
    </g>
    <g transform="translate(640 55)">
      <rect width="105" height="120" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="52" y="38" font-size="28">📊</text><text x="52" y="66" font-size="14" font-weight="800" fill="#15803d">6. Monitor</text>
      <text x="52" y="88" fill="#475569">logs · metrics</text><text x="52" y="104" font-size="10" fill="#64748b">alerts</text>
    </g>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="126" y1="115" x2="138" y2="115"/><line x1="251" y1="115" x2="263" y2="115"/>
    <line x1="376" y1="115" x2="388" y2="115"/><line x1="501" y1="115" x2="513" y2="115"/>
    <line x1="626" y1="115" x2="638" y2="115"/>
    <path d="M692 177 C 692 250, 70 250, 70 179" stroke-dasharray="6 5"/>
  </g>
  <rect x="215" y="230" width="330" height="28" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="380" y="249" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">What you learn in production shapes the next change</text>
  <rect x="140" y="182" width="235" height="20" rx="10" fill="#eef2ff"/>
  <text x="257" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#3730a3">CI: automated on every push</text>
  <rect x="390" y="182" width="225" height="20" rx="10" fill="#fef9c3"/>
  <text x="502" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#854d0e">CD: automated release to servers</text>
</svg>
