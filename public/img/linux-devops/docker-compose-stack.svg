<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Docker Compose on one server</text>

  <!-- internet -->
  <g transform="translate(15 110)">
    <rect width="110" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="55" y="30" text-anchor="middle" font-size="22">🌍</text>
    <text x="55" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Users</text>
  </g>

  <!-- host -->
  <rect x="150" y="40" width="595" height="245" rx="16" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="170" y="62" font-size="13" font-weight="800" fill="#a16207">🐧 Linux host · Docker Engine</text>

  <!-- compose network -->
  <rect x="200" y="74" width="530" height="150" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="715" y="92" text-anchor="end" font-size="11" font-weight="700" fill="#1e40af">compose network (private)</text>

  <g font-size="12" text-anchor="middle">
    <g transform="translate(215 104)">
      <rect width="140" height="100" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
      <text x="70" y="26" font-size="14" font-weight="800" fill="#15803d">🐳 nginx</text>
      <text x="70" y="48" fill="#334155">TLS + proxy</text>
      <text x="70" y="68" font-size="11" fill="#b91c1c" font-weight="700">ports 80, 443</text>
      <text x="70" y="86" font-size="10" fill="#64748b">published to host</text>
    </g>
    <g transform="translate(395 104)">
      <rect width="140" height="100" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2.5"/>
      <text x="70" y="26" font-size="14" font-weight="800" fill="#5b21b6">🐳 app</text>
      <text x="70" y="48" fill="#334155" font-family="Consolas, monospace" font-size="11">myapp:3f2a9c1</text>
      <text x="70" y="68" font-size="11" fill="#334155">expose 3000</text>
      <text x="70" y="86" font-size="10" fill="#15803d">❤️ healthy</text>
    </g>
    <g transform="translate(575 104)">
      <rect width="140" height="100" rx="12" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
      <text x="70" y="26" font-size="14" font-weight="800" fill="#0369a1">🐳 db</text>
      <text x="70" y="48" fill="#334155">postgres:16</text>
      <text x="70" y="68" font-size="11" fill="#334155">5432 (internal)</text>
      <text x="70" y="86" font-size="10" fill="#15803d">❤️ pg_isready</text>
    </g>
  </g>

  <!-- volume -->
  <g transform="translate(575 238)">
    <rect width="140" height="38" rx="10" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="70" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">💾 volume: pgdata</text>
  </g>
  <line x1="645" y1="205" x2="645" y2="236" stroke="#0ea5e9" stroke-width="2"/>
  <g transform="translate(215 238)">
    <rect width="320" height="38" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="160" y="16" text-anchor="middle" font-size="11" fill="#334155">.env (chmod 600) · compose.yaml · nginx.conf</text>
    <text x="160" y="31" text-anchor="middle" font-size="10" fill="#64748b">files on the host, mounted or read by Compose</text>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="126" y1="145" x2="213" y2="150"/>
    <line x1="356" y1="154" x2="393" y2="154"/>
    <line x1="536" y1="154" x2="573" y2="154"/>
  </g>
  <text x="375" y="146" text-anchor="middle" font-size="10" fill="#475569">app:3000</text>
  <text x="555" y="146" text-anchor="middle" font-size="10" fill="#475569">db:5432</text>
  <text x="170" y="138" text-anchor="middle" font-size="10" fill="#475569">443</text>
</svg>
