<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="290" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Reading a permission string</text>

  <!-- the string -->
  <g font-family="Consolas, Menlo, monospace" font-size="34" font-weight="800" text-anchor="middle">
    <rect x="60" y="48" width="44" height="56" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="82" y="88" fill="#334155">-</text>
    <rect x="124" y="48" width="132" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="190" y="88" fill="#1e40af" letter-spacing="6">rwx</text>
    <rect x="276" y="48" width="132" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="342" y="88" fill="#15803d" letter-spacing="6">r-x</text>
    <rect x="428" y="48" width="132" height="56" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="494" y="88" fill="#c2410c" letter-spacing="6">r--</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="15" fill="#475569">
    <text x="580" y="74">deploy</text><text x="580" y="96">www-data</text>
  </g>
  <text x="660" y="74" font-size="11" fill="#64748b">← owner</text>
  <text x="660" y="96" font-size="11" fill="#64748b">← group</text>

  <!-- labels -->
  <g font-size="12" text-anchor="middle">
    <text x="82" y="126" font-weight="700" fill="#334155">type</text>
    <text x="82" y="142" font-size="11" fill="#64748b">- file</text>
    <text x="82" y="156" font-size="11" fill="#64748b">d folder</text>
    <text x="82" y="170" font-size="11" fill="#64748b">l link</text>
    <text x="190" y="126" font-weight="700" fill="#1e40af">👤 owner (u)</text>
    <text x="190" y="144" fill="#334155">read + write + run</text>
    <text x="342" y="126" font-weight="700" fill="#15803d">👥 group (g)</text>
    <text x="342" y="144" fill="#334155">read + run</text>
    <text x="494" y="126" font-weight="700" fill="#c2410c">🌍 others (o)</text>
    <text x="494" y="144" fill="#334155">read only</text>
  </g>

  <!-- octal math -->
  <g font-size="13" text-anchor="middle">
    <rect x="124" y="186" width="132" height="54" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-dasharray="5 4"/>
    <text x="190" y="208" fill="#1e40af" font-family="Consolas, monospace">4 + 2 + 1</text>
    <text x="190" y="230" font-size="20" font-weight="800" fill="#1e40af">7</text>
    <rect x="276" y="186" width="132" height="54" rx="10" fill="#ffffff" stroke="#22c55e" stroke-dasharray="5 4"/>
    <text x="342" y="208" fill="#15803d" font-family="Consolas, monospace">4 + 0 + 1</text>
    <text x="342" y="230" font-size="20" font-weight="800" fill="#15803d">5</text>
    <rect x="428" y="186" width="132" height="54" rx="10" fill="#ffffff" stroke="#f97316" stroke-dasharray="5 4"/>
    <text x="494" y="208" fill="#c2410c" font-family="Consolas, monospace">4 + 0 + 0</text>
    <text x="494" y="230" font-size="20" font-weight="800" fill="#c2410c">4</text>
  </g>
  <g font-size="12">
    <rect x="590" y="186" width="150" height="54" rx="10" fill="#1e293b"/>
    <text x="665" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#fde68a">chmod 754</text>
    <text x="665" y="230" text-anchor="middle" font-size="11" fill="#cbd5e1">same as rwxr-xr--</text>
  </g>
  <text x="380" y="272" text-anchor="middle" font-size="12" fill="#475569">r = 4 (read)   ·   w = 2 (write)   ·   x = 1 (execute)   ·   add them per column</text>
</svg>
