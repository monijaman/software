<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Nginx as the receptionist: one public door, many private apps</text>

  <!-- visitors -->
  <g font-size="12">
    <g transform="translate(15 56)"><rect width="165" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="12" y="20" font-weight="700" fill="#1e40af">🌐 shop.example.com</text><text x="12" y="36" fill="#475569">https:// (port 443)</text></g>
    <g transform="translate(15 126)"><rect width="165" height="46" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="12" y="20" font-weight="700" fill="#1e40af">🌐 academy.example.com</text><text x="12" y="36" fill="#475569">https:// (port 443)</text></g>
    <g transform="translate(15 196)"><rect width="165" height="46" rx="10" fill="#f8fafc" stroke="#94a3b8"/><text x="12" y="20" font-weight="700" fill="#334155">🌐 http://example.com</text><text x="12" y="36" fill="#475569">port 80</text></g>
  </g>

  <!-- server box -->
  <rect x="225" y="40" width="520" height="245" rx="16" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="485" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="#a16207">🐧 One Linux server</text>

  <!-- nginx -->
  <rect x="245" y="78" width="200" height="190" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="345" y="102" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">Nginx :80 / :443</text>
  <g font-size="11" fill="#334155">
    <text x="260" y="126">🔒 TLS (Let's Encrypt)</text>
    <text x="260" y="146">🧭 match server_name</text>
    <text x="260" y="166">↪ 80 → 301 to HTTPS</text>
    <text x="260" y="186">🗜️ gzip, static cache</text>
    <text x="260" y="206">🛡️ headers, rate limits</text>
    <text x="260" y="226">📜 access/error logs</text>
  </g>
  <text x="345" y="254" text-anchor="middle" font-size="10" fill="#64748b">the only part reachable from outside</text>

  <!-- apps -->
  <g font-size="12">
    <g transform="translate(510 82)"><rect width="215" height="56" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/><text x="14" y="24" font-weight="800" fill="#5b21b6">🛒 Shop app</text><text x="14" y="44" fill="#334155" font-family="Consolas, monospace">127.0.0.1:3000</text></g>
    <g transform="translate(510 152)"><rect width="215" height="56" rx="12" fill="#ffffff" stroke="#f97316" stroke-width="2"/><text x="14" y="24" font-weight="800" fill="#c2410c">📚 Academy app</text><text x="14" y="44" fill="#334155" font-family="Consolas, monospace">127.0.0.1:3001</text></g>
    <g transform="translate(510 222)"><rect width="215" height="46" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="14" y="20" font-weight="700" fill="#475569">📁 /var/www/static</text><text x="14" y="36" fill="#64748b" font-size="11">files served directly</text></g>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="180" y1="79" x2="243" y2="120"/>
    <line x1="180" y1="149" x2="243" y2="160"/>
    <line x1="180" y1="219" x2="243" y2="200"/>
    <line x1="445" y1="125" x2="508" y2="110"/>
    <line x1="445" y1="165" x2="508" y2="180"/>
    <line x1="445" y1="215" x2="508" y2="242"/>
  </g>
  <text x="476" y="104" text-anchor="middle" font-size="10" fill="#5b21b6">proxy_pass</text>
</svg>
