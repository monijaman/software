<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker></defs>
  <rect width="760" height="280" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Blue-green: deploy to the idle slot, then switch Nginx</text>

  <g transform="translate(20 100)">
    <rect width="110" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="55" y="30" text-anchor="middle" font-size="22">🌍</text>
    <text x="55" y="54" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Users</text>
  </g>

  <g transform="translate(180 85)">
    <rect width="170" height="100" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <text x="85" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">Nginx</text>
    <text x="85" y="50" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas, monospace">upstream myapp {</text>
    <text x="85" y="66" text-anchor="middle" font-size="11" fill="#334155" font-family="Consolas, monospace">server :3000; }</text>
    <text x="85" y="88" text-anchor="middle" font-size="10" fill="#64748b">reload = no dropped requests</text>
  </g>

  <g transform="translate(420 45)">
    <rect width="200" height="80" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">🔵 Blue :3000</text>
    <text x="100" y="46" text-anchor="middle" font-size="11" fill="#334155">v41 · LIVE</text>
    <text x="100" y="64" text-anchor="middle" font-size="10" fill="#64748b">serving all traffic</text>
  </g>
  <g transform="translate(420 150)">
    <rect width="200" height="80" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="100" y="26" text-anchor="middle" font-size="15" font-weight="800" fill="#15803d">🟢 Green :3001</text>
    <text x="100" y="46" text-anchor="middle" font-size="11" fill="#334155">v42 · idle, being tested</text>
    <text x="100" y="64" text-anchor="middle" font-size="10" fill="#64748b">curl 127.0.0.1:3001 ✅</text>
  </g>

  <line x1="131" y1="135" x2="178" y2="135" stroke="#64748b" stroke-width="2"/>
  <path d="M350 120 C 380 100, 395 90, 418 86" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M350 150 C 380 175, 395 185, 418 190" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrG)"/>

  <g font-size="11" fill="#334155">
    <rect x="640" y="50" width="110" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="695" y="72" text-anchor="middle" font-weight="800" fill="#334155">Steps</text>
    <text x="652" y="96">1. deploy v42</text><text x="664" y="110">to green</text>
    <text x="652" y="134">2. health</text><text x="664" y="148">check :3001</text>
    <text x="652" y="172">3. switch to</text><text x="664" y="186">3001, reload</text>
    <text x="652" y="206">4. blue stays</text><text x="664" y="220">as rollback</text>
  </g>
  <text x="380" y="262" text-anchor="middle" font-size="12" fill="#475569">Next deploy goes to blue. Rollback = point the upstream back and reload (about 1 second).</text>
</svg>
