<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Keep a server healthy: watch it, alert on it, back it up</text>

  <!-- server -->
  <g transform="translate(20 70)">
    <rect width="190" height="170" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="95" y="26" text-anchor="middle" font-size="14" font-weight="800" fill="#a16207">🐧 Server</text>
    <g font-size="11" fill="#334155">
      <text x="14" y="52">💾 disk 64%</text>
      <rect x="100" y="43" width="76" height="10" rx="5" fill="#e2e8f0"/><rect x="100" y="43" width="49" height="10" rx="5" fill="#22c55e"/>
      <text x="14" y="74">🧠 memory 71%</text>
      <rect x="100" y="65" width="76" height="10" rx="5" fill="#e2e8f0"/><rect x="100" y="65" width="54" height="10" rx="5" fill="#eab308"/>
      <text x="14" y="96">⚙️ CPU 23%</text>
      <rect x="100" y="87" width="76" height="10" rx="5" fill="#e2e8f0"/><rect x="100" y="87" width="18" height="10" rx="5" fill="#22c55e"/>
      <text x="14" y="122">📜 journald · nginx logs</text>
      <text x="14" y="142">❤️ /health → 200</text>
      <text x="14" y="160">🗄️ PostgreSQL</text>
    </g>
  </g>

  <!-- watch -->
  <g font-size="12" text-anchor="middle">
    <g transform="translate(270 50)"><rect width="190" height="56" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="95" y="24" font-weight="800" fill="#1e40af">🌐 Uptime check</text><text x="95" y="42" font-size="11" fill="#334155">every minute, from outside</text></g>
    <g transform="translate(270 122)"><rect width="190" height="56" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="95" y="24" font-weight="800" fill="#5b21b6">📈 Metrics</text><text x="95" y="42" font-size="11" fill="#334155">node_exporter → Prometheus</text></g>
    <g transform="translate(270 194)"><rect width="190" height="56" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><text x="95" y="24" font-weight="800" fill="#334155">🔎 Logs</text><text x="95" y="42" font-size="11" fill="#334155">rotated, searchable</text></g>

    <g transform="translate(520 70)"><rect width="220" height="70" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="110" y="28" font-weight="800" fill="#15803d">📊 Dashboards</text><text x="110" y="48" font-size="11" fill="#334155">Grafana: trends over time</text></g>
    <g transform="translate(520 160)"><rect width="220" height="70" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="110" y="28" font-weight="800" fill="#b91c1c">🔔 Alerts</text><text x="110" y="48" font-size="11" fill="#334155">disk &gt; 85% · site down · 5xx</text></g>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="268" y1="78" x2="212" y2="110"/>
    <line x1="212" y1="150" x2="268" y2="150"/>
    <line x1="212" y1="200" x2="268" y2="218"/>
    <line x1="461" y1="80" x2="518" y2="180"/>
    <line x1="461" y1="150" x2="518" y2="110"/>
    <line x1="461" y1="150" x2="518" y2="190"/>
  </g>

  <!-- backups -->
  <g transform="translate(20 255)">
    <rect width="720" height="36" rx="10" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="360" y="23" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">💾 03:00 pg_dump → ☁️ off-site storage (3-2-1) → 📅 monthly test restore → ✅ ping "backup OK"</text>
  </g>
</svg>
