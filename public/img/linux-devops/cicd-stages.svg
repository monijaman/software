<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">A CI/CD pipeline: fast checks first, build once, promote the same artifact</text>

  <rect x="12" y="44" width="430" height="150" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="227" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#1e40af">CI: every push and pull request</text>
  <rect x="452" y="44" width="296" height="150" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="64" text-anchor="middle" font-size="12" font-weight="800" fill="#15803d">CD: main branch only</text>

  <g font-size="12" text-anchor="middle">
    <g transform="translate(24 80)"><rect width="88" height="92" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text x="44" y="30" font-size="20">📥</text><text x="44" y="54" font-weight="800" fill="#1e3a8a">Checkout</text><text x="44" y="72" font-size="10" fill="#64748b">install deps</text></g>
    <g transform="translate(128 80)"><rect width="88" height="92" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text x="44" y="30" font-size="20">🧹</text><text x="44" y="54" font-weight="800" fill="#1e3a8a">Lint</text><text x="44" y="72" font-size="10" fill="#64748b">seconds</text></g>
    <g transform="translate(232 80)"><rect width="88" height="92" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text x="44" y="30" font-size="20">🧪</text><text x="44" y="54" font-weight="800" fill="#1e3a8a">Test</text><text x="44" y="72" font-size="10" fill="#64748b">unit + scans</text></g>
    <g transform="translate(336 80)"><rect width="94" height="92" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text x="47" y="30" font-size="20">📦</text><text x="47" y="54" font-weight="800" fill="#1e3a8a">Build</text><text x="47" y="72" font-size="10" fill="#64748b">app:3f9c2a1</text></g>
    <g transform="translate(466 80)"><rect width="80" height="92" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="40" y="30" font-size="20">🧪</text><text x="40" y="54" font-weight="800" fill="#14532d">Staging</text><text x="40" y="72" font-size="10" fill="#64748b">auto deploy</text></g>
    <g transform="translate(564 80)"><rect width="70" height="92" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/><text x="35" y="30" font-size="20">✋</text><text x="35" y="54" font-weight="800" fill="#a16207">Gate</text><text x="35" y="72" font-size="10" fill="#64748b">approve</text></g>
    <g transform="translate(652 80)"><rect width="84" height="92" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="42" y="30" font-size="20">🚀</text><text x="42" y="54" font-weight="800" fill="#14532d">Prod</text><text x="42" y="72" font-size="10" fill="#64748b">same artifact</text></g>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="112" y1="126" x2="126" y2="126"/><line x1="216" y1="126" x2="230" y2="126"/><line x1="320" y1="126" x2="334" y2="126"/>
    <line x1="430" y1="126" x2="464" y2="126"/><line x1="546" y1="126" x2="562" y2="126"/><line x1="634" y1="126" x2="650" y2="126"/>
  </g>

  <g transform="translate(336 214)">
    <rect width="400" height="40" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="200" y="25" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">🗄️ Artifact registry: app:3f9c2a1 is built once, deployed everywhere</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)">
    <line x1="383" y1="174" x2="383" y2="212"/>
    <line x1="506" y1="212" x2="506" y2="174"/>
    <line x1="694" y1="212" x2="694" y2="174"/>
  </g>
  <rect x="24" y="214" width="290" height="40" rx="10" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="169" y="239" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">❌ any stage fails → the line stops, nothing ships</text>
  <text x="380" y="284" text-anchor="middle" font-size="11" fill="#64748b">Continuous delivery keeps the ✋ gate · continuous deployment removes it</text>
</svg>
