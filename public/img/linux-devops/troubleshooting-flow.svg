<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="310" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">"The site is down": follow the request, layer by layer</text>

  <g transform="translate(15 40)">
    <rect width="730" height="34" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="365" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">0. What changed? A deploy, config edit or traffic spike? Roll back first, then investigate</text>
  </g>

  <g font-size="11" text-anchor="middle">
    <g transform="translate(15 92)"><rect width="110" height="150" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="55" y="28" font-size="20">🌐</text><text x="55" y="52" font-size="13" font-weight="800" fill="#1e40af">1. DNS</text><text x="55" y="78" fill="#334155" font-family="Consolas, monospace">dig +short</text><text x="55" y="110" fill="#64748b">wrong record?</text><text x="55" y="126" fill="#64748b">domain expired?</text></g>
    <g transform="translate(138 92)"><rect width="110" height="150" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/><text x="55" y="28" font-size="20">🖥️</text><text x="55" y="52" font-size="13" font-weight="800" fill="#5b21b6">2. Server</text><text x="55" y="78" fill="#334155" font-family="Consolas, monospace">ssh · ping</text><text x="55" y="110" fill="#64748b">down? frozen?</text><text x="55" y="126" fill="#64748b">provider issue?</text></g>
    <g transform="translate(261 92)"><rect width="110" height="150" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="55" y="28" font-size="20">🔥</text><text x="55" y="52" font-size="13" font-weight="800" fill="#b91c1c">3. Ports</text><text x="55" y="78" fill="#334155" font-family="Consolas, monospace">ufw status</text><text x="55" y="94" fill="#334155" font-family="Consolas, monospace">ss -ltnp</text><text x="55" y="126" fill="#64748b">443 closed?</text></g>
    <g transform="translate(384 92)"><rect width="110" height="150" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/><text x="55" y="28" font-size="20">🧭</text><text x="55" y="52" font-size="13" font-weight="800" fill="#15803d">4. Nginx</text><text x="55" y="78" fill="#334155" font-family="Consolas, monospace">nginx -t</text><text x="55" y="94" fill="#334155" font-family="Consolas, monospace">error.log</text><text x="55" y="126" fill="#64748b">502? 504? cert?</text></g>
    <g transform="translate(507 92)"><rect width="110" height="150" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/><text x="55" y="28" font-size="20">🟢</text><text x="55" y="52" font-size="13" font-weight="800" fill="#a16207">5. App</text><text x="55" y="78" fill="#334155" font-family="Consolas, monospace">status · curl</text><text x="55" y="94" fill="#334155" font-family="Consolas, monospace">journalctl</text><text x="55" y="126" fill="#64748b">crash? port? env?</text></g>
    <g transform="translate(630 92)"><rect width="115" height="150" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/><text x="57" y="28" font-size="20">🗄️</text><text x="57" y="52" font-size="13" font-weight="800" fill="#0e7490">6. DB + disk</text><text x="57" y="78" fill="#334155" font-family="Consolas, monospace">df -h · free -h</text><text x="57" y="94" fill="#334155" font-family="Consolas, monospace">dmesg (OOM)</text><text x="57" y="126" fill="#64748b">full? killed?</text></g>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="126" y1="167" x2="136" y2="167"/><line x1="249" y1="167" x2="259" y2="167"/>
    <line x1="372" y1="167" x2="382" y2="167"/><line x1="495" y1="167" x2="505" y2="167"/>
    <line x1="618" y1="167" x2="628" y2="167"/>
  </g>

  <g transform="translate(15 256)">
    <rect width="730" height="44" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="365" y="19" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">The first layer that fails is where the problem lives.</text>
    <text x="365" y="36" text-anchor="middle" font-size="11" fill="#475569">Users → DNS → server → firewall → Nginx → app → database and resources</text>
  </g>
</svg>
