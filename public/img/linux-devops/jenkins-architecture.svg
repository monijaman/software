<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Jenkins: the controller schedules, agents do the work</text>

  <g transform="translate(15 110)">
    <rect width="130" height="100" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="65" y="34" text-anchor="middle" font-size="24">🐙</text>
    <text x="65" y="58" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">Git repo</text>
    <text x="65" y="76" text-anchor="middle" font-size="10" fill="#64748b">code + Jenkinsfile</text>
  </g>

  <g transform="translate(205 70)">
    <rect width="220" height="180" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="110" y="30" text-anchor="middle" font-size="22">🤵</text>
    <text x="110" y="54" text-anchor="middle" font-size="14" font-weight="800" fill="#991b1b">Jenkins controller</text>
    <g font-size="11" fill="#7f1d1d">
      <text x="18" y="80">🖥️ web UI on :8080 (behind Nginx)</text>
      <text x="18" y="100">📋 job queue + scheduling</text>
      <text x="18" y="120">🔑 credentials store</text>
      <text x="18" y="140">🧩 plugins</text>
      <text x="18" y="160">💾 JENKINS_HOME · 0 executors</text>
    </g>
  </g>

  <g font-size="11">
    <g transform="translate(500 44)"><rect width="245" height="64" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="14" y="24" font-size="13" font-weight="800" fill="#1e40af">🐧 Linux agent (SSH)</text><text x="14" y="44" fill="#475569">label: linux docker · 2 executors</text></g>
    <g transform="translate(500 128)"><rect width="245" height="64" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="14" y="24" font-size="13" font-weight="800" fill="#1e40af">🐳 Docker agent</text><text x="14" y="44" fill="#475569">fresh container per stage</text></g>
    <g transform="translate(500 212)"><rect width="245" height="64" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="14" y="24" font-size="13" font-weight="800" fill="#1e40af">☸️ Kubernetes Pod agent</text><text x="14" y="44" fill="#475569">created per build, then deleted</text></g>
  </g>

  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="146" y1="160" x2="203" y2="160"/>
    <line x1="426" y1="130" x2="498" y2="78"/>
    <line x1="426" y1="160" x2="498" y2="160"/>
    <line x1="426" y1="190" x2="498" y2="242"/>
  </g>
  <text x="175" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">webhook</text>
  <text x="460" y="96" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">run build</text>
  <text x="380" y="300" text-anchor="middle" font-size="11" fill="#64748b">Agents build, test and deploy; results and logs flow back to the controller</text>
</svg>
