<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI,system-ui,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs><rect width="760" height="300" fill="#fff"/><text x="38" y="38" font-size="22" font-weight="800" fill="#1e293b">L6 thinking loop</text><text x="38" y="61" font-size="13" fill="#64748b">Start with the rule that cannot be broken.</text><line x1="165" y1="156" x2="180" y2="156" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="295" y1="156" x2="310" y2="156" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="425" y1="156" x2="440" y2="156" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="555" y1="156" x2="570" y2="156" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><g><rect x="55" y="125" width="110" height="62" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="110" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Invariant</text><text x="110" y="172" text-anchor="middle" font-size="11" fill="#475569">correctness</text></g><g><rect x="185" y="125" width="110" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="240" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Peak</text><text x="240" y="172" text-anchor="middle" font-size="11" fill="#475569">capacity</text></g><g><rect x="315" y="125" width="110" height="62" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="370" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Failure</text><text x="370" y="172" text-anchor="middle" font-size="11" fill="#475569">what can break</text></g><g><rect x="445" y="125" width="110" height="62" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="500" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Recovery</text><text x="500" y="172" text-anchor="middle" font-size="11" fill="#475569">safe return</text></g><g><rect x="575" y="125" width="130" height="62" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="640" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Blast radius</text><text x="640" y="172" text-anchor="middle" font-size="11" fill="#475569">who else hurts</text></g><text x="380" y="279" text-anchor="middle" font-size="12" fill="#64748b">Design for the failure path, then prove it with metrics.</text></svg>