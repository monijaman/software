<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI,system-ui,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs><rect width="760" height="300" fill="#fff"/><text x="38" y="38" font-size="22" font-weight="800" fill="#1e293b">Control plane vs data plane</text><text x="38" y="61" font-size="13" fill="#64748b">Tiny APIs decide access; a CDN carries the video bytes.</text><line x1="180" y1="136" x2="220" y2="113" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="180" y1="150" x2="220" y2="213" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="360" y1="216" x2="470" y2="216" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="605" y1="216" x2="630" y2="216" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><g><rect x="45" y="105" width="135" height="62" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="112.5" y="132" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Viewer</text><text x="112.5" y="152" text-anchor="middle" font-size="11" fill="#475569">press Play</text></g><g><rect x="225" y="82" width="130" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="290" y="109" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Control API</text><text x="290" y="129" text-anchor="middle" font-size="11" fill="#475569">auth + manifest</text></g><g><rect x="225" y="185" width="130" height="62" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="290" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">CDN edge</text><text x="290" y="232" text-anchor="middle" font-size="11" fill="#475569">video segments</text></g><g><rect x="475" y="185" width="125" height="62" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="537.5" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Regional cache</text><text x="537.5" y="232" text-anchor="middle" font-size="11" fill="#475569">tiered</text></g><g><rect x="635" y="185" width="85" height="62" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="677.5" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Origin</text><text x="677.5" y="232" text-anchor="middle" font-size="11" fill="#475569">storage</text></g><text x="380" y="279" text-anchor="middle" font-size="12" fill="#64748b">Design for the failure path, then prove it with metrics.</text></svg>