<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="Segoe UI,system-ui,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs><rect width="760" height="280" fill="#fff"/><text x="32" y="42" font-size="22" font-weight="800" fill="#1e293b">Collaborative edit path</text><text x="32" y="66" font-size="13" fill="#64748b">One fenced writer per document gives every edit a durable, total order.</text><line x1="152" y1="165" x2="172" y2="165" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="298" y1="165" x2="318" y2="165" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="444" y1="165" x2="464" y2="165" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="590" y1="165" x2="610" y2="165" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><g><rect x="32" y="132" width="120" height="66" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="92" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Client</text><text x="92" y="181" text-anchor="middle" font-size="11" fill="#475569">local apply</text></g><g><rect x="178" y="132" width="120" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="238" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Sequencer</text><text x="238" y="181" text-anchor="middle" font-size="11" fill="#475569">lease + epoch</text></g><g><rect x="324" y="132" width="120" height="66" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="384" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Op log</text><text x="384" y="181" text-anchor="middle" font-size="11" fill="#475569">(docId, rev)</text></g><g><rect x="470" y="132" width="120" height="66" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="530" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Fan-out</text><text x="530" y="181" text-anchor="middle" font-size="11" fill="#475569">ack + relays</text></g><g><rect x="616" y="132" width="120" height="66" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/><text x="676" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Snapshot</text><text x="676" y="181" text-anchor="middle" font-size="11" fill="#475569">compact + GC</text></g><text x="380" y="246" text-anchor="middle" font-size="12" fill="#64748b">Presence and cursors skip the log: they are ephemeral and throttled.</text></svg>
