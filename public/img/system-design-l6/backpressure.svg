<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI,system-ui,sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs><rect width="760" height="300" fill="#fff"/><text x="38" y="38" font-size="22" font-weight="800" fill="#1e293b">Bounded work protects the system</text><text x="38" y="61" font-size="13" fill="#64748b">Every request has a deadline; every queue has a limit.</text><line x1="170" y1="156" x2="205" y2="156" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="340" y1="156" x2="400" y2="156" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><line x1="530" y1="156" x2="590" y2="156" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/><g><rect x="45" y="125" width="120" height="62" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="105" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Gateway</text><text x="105" y="172" text-anchor="middle" font-size="11" fill="#475569">deadline</text></g><g><rect x="210" y="125" width="125" height="62" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="272.5" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Concurrency</text><text x="272.5" y="172" text-anchor="middle" font-size="11" fill="#475569">limited</text></g><g><rect x="405" y="125" width="120" height="62" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="465" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Queue</text><text x="465" y="172" text-anchor="middle" font-size="11" fill="#475569">bounded</text></g><g><rect x="595" y="125" width="120" height="62" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="655" y="152" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Worker</text><text x="655" y="172" text-anchor="middle" font-size="11" fill="#475569">shed / DLQ</text></g><text x="380" y="279" text-anchor="middle" font-size="12" fill="#64748b">Design for the failure path, then prove it with metrics.</text></svg>