<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f172a"/></marker></defs>
  <g transform="translate(260 180)" text-anchor="middle">
    <circle r="165" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <circle r="122" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <circle r="80" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <circle r="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text y="-2" font-size="12" font-weight="800" fill="#78350f">Entities</text>
    <text y="13" font-size="9" fill="#92400e">Order, rules</text>
    <text y="-54" font-size="12" font-weight="800" fill="#14532d">Use cases</text>
    <text y="62" font-size="10" fill="#166534">PlaceOrder · ports</text>
    <text y="-96" font-size="12" font-weight="800" fill="#1e3a8a">Interface adapters</text>
    <text y="104" font-size="10" fill="#1e40af">controllers · presenters · repositories</text>
    <text y="-140" font-size="12" font-weight="800" fill="#4c1d95">Frameworks &amp; drivers</text>
    <text y="146" font-size="10" fill="#5b21b6">Express · React · Postgres · Stripe</text>
    <g stroke="#0f172a" stroke-width="2.5" fill="none" marker-end="url(#a)">
      <path d="M-150 -40 L-86 -18"/><path d="M150 -40 L86 -18"/><path d="M-110 60 L-66 30"/><path d="M110 60 L66 30"/>
    </g>
  </g>
  <g transform="translate(470 40)">
    <rect width="270" height="280" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="18" y="32" font-size="15" font-weight="800" fill="#0f172a">The Dependency Rule</text>
    <text x="18" y="56" font-size="12" fill="#475569">Arrows = source-code imports.</text>
    <text x="18" y="74" font-size="12" fill="#475569">They always point inward.</text>
    <g font-size="12">
      <circle cx="26" cy="104" r="7" fill="#fef3c7" stroke="#f59e0b"/><text x="42" y="108" fill="#0f172a">most stable, most valuable</text>
      <circle cx="26" cy="132" r="7" fill="#dcfce7" stroke="#22c55e"/><text x="42" y="136" fill="#0f172a">what the app does</text>
      <circle cx="26" cy="160" r="7" fill="#dbeafe" stroke="#3b82f6"/><text x="42" y="164" fill="#0f172a">translators between worlds</text>
      <circle cx="26" cy="188" r="7" fill="#ede9fe" stroke="#8b5cf6"/><text x="42" y="192" fill="#0f172a">replaceable details</text>
    </g>
    <text x="18" y="228" font-size="12" font-weight="700" fill="#c2410c">Swap Express for Fastify,</text>
    <text x="18" y="246" font-size="12" font-weight="700" fill="#c2410c">Postgres for Mongo:</text>
    <text x="18" y="264" font-size="12" fill="#475569">entities and use cases don't change.</text>
  </g>
</svg>
