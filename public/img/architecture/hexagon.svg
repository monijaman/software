<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="120" y="30" text-anchor="middle" font-size="14" font-weight="800" fill="#1d4ed8">⬅️ Driving side</text>
  <text x="120" y="48" text-anchor="middle" font-size="11" fill="#475569">they call the app</text>
  <text x="640" y="30" text-anchor="middle" font-size="14" font-weight="800" fill="#047857">Driven side ➡️</text>
  <text x="640" y="48" text-anchor="middle" font-size="11" fill="#475569">the app calls them</text>
  <g transform="translate(380 190)">
    <polygon points="-150,0 -75,-130 75,-130 150,0 75,130 -75,130" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
    <polygon points="-80,0 -40,-70 40,-70 80,0 40,70 -40,70" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
    <text y="-8" text-anchor="middle" font-size="14" font-weight="800" fill="#7c2d12">Domain</text>
    <text y="12" text-anchor="middle" font-size="11" fill="#9a3412">rules, entities</text>
    <text y="-96" text-anchor="middle" font-size="12" font-weight="700" fill="#9a3412">Application core: use cases</text>
    <g fill="#ea580c">
      <rect x="-128" y="-60" width="18" height="30" rx="4"/><rect x="-128" y="30" width="18" height="30" rx="4"/>
      <rect x="110" y="-60" width="18" height="30" rx="4"/><rect x="110" y="30" width="18" height="30" rx="4"/>
    </g>
    <text x="-100" y="-66" font-size="10" font-weight="700" fill="#c2410c">port</text>
    <text x="80" y="-66" font-size="10" font-weight="700" fill="#c2410c">port</text>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <g transform="translate(120 105)"><rect x="-80" y="-22" width="160" height="44" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text y="5" fill="#1e3a8a">🌐 REST controller</text></g>
    <g transform="translate(120 165)"><rect x="-80" y="-22" width="160" height="44" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text y="5" fill="#1e3a8a">⌨️ CLI</text></g>
    <g transform="translate(120 225)"><rect x="-80" y="-22" width="160" height="44" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text y="5" fill="#1e3a8a">📨 Queue consumer</text></g>
    <g transform="translate(120 285)"><rect x="-80" y="-22" width="160" height="44" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" stroke-dasharray="5 4"/><text y="5" fill="#3730a3">🧪 Tests</text></g>
    <g transform="translate(640 105)"><rect x="-80" y="-22" width="160" height="44" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text y="5" fill="#14532d">🗄️ Postgres</text></g>
    <g transform="translate(640 165)"><rect x="-80" y="-22" width="160" height="44" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text y="5" fill="#14532d">📧 Email service</text></g>
    <g transform="translate(640 225)"><rect x="-80" y="-22" width="160" height="44" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text y="5" fill="#14532d">💳 Payment API</text></g>
    <g transform="translate(640 285)"><rect x="-80" y="-22" width="160" height="44" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4"/><text y="5" fill="#065f46">🧠 In-memory fake</text></g>
  </g>
  <g stroke="#3b82f6" stroke-width="2" fill="none"><path d="M200 105 C 230 110, 240 135, 252 145"/><path d="M200 165 C 225 165, 240 160, 252 158"/><path d="M200 225 C 225 225, 240 225, 252 228"/><path d="M200 285 C 230 280, 240 245, 252 238"/></g>
  <g stroke="#22c55e" stroke-width="2" fill="none"><path d="M560 105 C 530 110, 520 135, 508 145"/><path d="M560 165 C 535 165, 520 160, 508 158"/><path d="M560 225 C 535 225, 520 225, 508 228"/><path d="M560 285 C 530 280, 520 245, 508 238"/></g>
  <text x="380" y="350" text-anchor="middle" font-size="12" fill="#475569">Adapters plug into ports · the core never imports an adapter</text>
</svg>
