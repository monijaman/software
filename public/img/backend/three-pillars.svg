<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="740" height="280" fill="#ffffff"/>
  <path d="M40 60 L370 14 L700 60 Z" fill="#e2e8f0"/>
  <text x="370" y="50" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Observability</text>
  <g text-anchor="middle">
    <g transform="translate(150 70)">
      <rect x="-90" width="180" height="170" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
      <text y="36" font-size="30">📈</text><text y="68" font-size="17" font-weight="800" fill="#1e3a8a">Metrics</text>
      <text y="90" font-size="12" fill="#1e40af">WHAT is wrong?</text>
      <polyline points="-60,140 -35,128 -10,134 15,110 40,118 60,86" fill="none" stroke="#3b82f6" stroke-width="3"/>
      <text y="160" font-size="11" fill="#475569">numbers over time</text>
    </g>
    <g transform="translate(370 70)">
      <rect x="-90" width="180" height="170" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
      <text y="36" font-size="30">🧵</text><text y="68" font-size="17" font-weight="800" fill="#4c1d95">Traces</text>
      <text y="90" font-size="12" fill="#5b21b6">WHERE is it slow?</text>
      <rect x="-60" y="104" width="120" height="8" rx="3" fill="#c4b5fd"/><rect x="-50" y="116" width="40" height="8" rx="3" fill="#a78bfa"/><rect x="-6" y="128" width="60" height="8" rx="3" fill="#ef4444"/>
      <text y="160" font-size="11" fill="#475569">one request, every hop</text>
    </g>
    <g transform="translate(590 70)">
      <rect x="-90" width="180" height="170" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text y="36" font-size="30">📜</text><text y="68" font-size="17" font-weight="800" fill="#064e3b">Logs</text>
      <text y="90" font-size="12" fill="#065f46">WHY did it fail?</text>
      <g font-family="Consolas, monospace" font-size="9" fill="#334155" text-anchor="start"><text x="-74" y="112">03:12 info order ok</text><text x="-74" y="126" fill="#dc2626">03:12 error card declined</text><text x="-74" y="140">03:13 warn retrying</text></g>
      <text y="160" font-size="11" fill="#475569">detailed events</text>
    </g>
  </g>
  <rect x="40" y="244" width="660" height="18" fill="#cbd5e1"/>
  <text x="370" y="257" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">joined together by a shared traceId</text>
</svg>
