<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="230" fill="#ffffff"/>
  <g text-anchor="middle">
    <g transform="translate(80 20)"><rect x="-68" width="136" height="190" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text y="44" font-size="30">⏱️</text><text y="80" font-size="14" font-weight="800" fill="#1e3a8a">Timeout</text><text y="104" font-size="11" fill="#475569">never wait</text><text y="120" font-size="11" fill="#475569">forever</text><text y="168" font-size="10" font-family="Consolas, monospace" fill="#2563eb">timeout: 2s</text></g>
    <g transform="translate(230 20)"><rect x="-68" width="136" height="190" rx="14" fill="#fefce8" stroke="#eab308" stroke-width="2"/><text y="44" font-size="30">🔁</text><text y="80" font-size="14" font-weight="800" fill="#713f12">Retry</text><text y="104" font-size="11" fill="#475569">backoff + jitter</text><text y="120" font-size="11" fill="#475569">1s, 2s, 4s…</text><text y="168" font-size="10" font-family="Consolas, monospace" fill="#a16207">transient only</text></g>
    <g transform="translate(380 20)"><rect x="-68" width="136" height="190" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text y="44" font-size="30">⚡</text><text y="80" font-size="14" font-weight="800" fill="#991b1b">Circuit breaker</text><text y="104" font-size="11" fill="#475569">stop calling a</text><text y="120" font-size="11" fill="#475569">failing service</text><text y="168" font-size="10" font-family="Consolas, monospace" fill="#dc2626">closed/open/half</text></g>
    <g transform="translate(530 20)"><rect x="-68" width="136" height="190" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/><text y="44" font-size="30">🚢</text><text y="80" font-size="14" font-weight="800" fill="#155e75">Bulkhead</text><text y="104" font-size="11" fill="#475569">separate pools,</text><text y="120" font-size="11" fill="#475569">contain the flood</text><text y="168" font-size="10" font-family="Consolas, monospace" fill="#0891b2">max 20 calls</text></g>
    <g transform="translate(680 20)"><rect x="-68" width="136" height="190" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text y="44" font-size="30">🛟</text><text y="80" font-size="14" font-weight="800" fill="#064e3b">Fallback</text><text y="104" font-size="11" fill="#475569">degrade instead</text><text y="120" font-size="11" fill="#475569">of erroring</text><text y="168" font-size="10" font-family="Consolas, monospace" fill="#059669">cached / default</text></g>
  </g>
</svg>
