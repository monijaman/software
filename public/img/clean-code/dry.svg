<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="180" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">❌ Copies drift apart</text>
  <text x="540" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#047857">✅ One source of truth</text>
  <g font-family="Consolas, monospace" font-size="12" text-anchor="middle">
    <g transform="translate(40 50) rotate(-4)"><rect width="120" height="70" fill="#fef08a"/><text x="60" y="30" fill="#713f12">TAX = 0.20</text><text x="60" y="52" fill="#713f12">cart.js</text></g>
    <g transform="translate(190 46) rotate(5)"><rect width="120" height="70" fill="#fef08a"/><text x="60" y="30" fill="#713f12">TAX = 0.20</text><text x="60" y="52" fill="#713f12">invoice.js</text></g>
    <g transform="translate(40 150) rotate(3)"><rect width="120" height="70" fill="#fef08a"/><text x="60" y="30" fill="#713f12">TAX = 0.21</text><text x="60" y="52" fill="#713f12">checkout.js</text></g>
    <g transform="translate(190 150) rotate(-6)"><rect width="120" height="70" fill="#fecaca"/><text x="60" y="30" fill="#7f1d1d">TAX = 0.19 😱</text><text x="60" y="52" fill="#7f1d1d">report.js</text></g>
  </g>
  <line x1="360" y1="40" x2="360" y2="240" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="480" y="50" width="120" height="50" rx="10" fill="#bbf7d0" stroke="#22c55e" stroke-width="2"/>
    <text x="540" y="72" fill="#14532d" font-weight="700">TAX_RATE</text><text x="540" y="89" fill="#14532d">config.js</text>
    <g stroke="#22c55e" stroke-width="2"><line x1="540" y1="100" x2="420" y2="170"/><line x1="540" y1="100" x2="500" y2="170"/><line x1="540" y1="100" x2="580" y2="170"/><line x1="540" y1="100" x2="660" y2="170"/></g>
    <g fill="#f0fdf4" stroke="#86efac"><rect x="382" y="170" width="76" height="40" rx="8"/><rect x="462" y="170" width="76" height="40" rx="8"/><rect x="542" y="170" width="76" height="40" rx="8"/><rect x="622" y="170" width="76" height="40" rx="8"/></g>
    <g fill="#166534" font-size="11"><text x="420" y="194">cart</text><text x="500" y="194">invoice</text><text x="580" y="194">checkout</text><text x="660" y="194">report</text></g>
    <text x="540" y="238" fill="#166534" font-size="12">change once → everyone updated</text>
  </g>
