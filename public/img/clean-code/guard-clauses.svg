<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="720" height="260" fill="#ffffff"/>
  <text x="180" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">❌ Nested “arrow” code</text>
  <text x="540" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#047857">✅ Guard clauses</text>
  <g fill="#fecaca" stroke="#f87171">
    <rect x="40" y="46" width="280" height="24" rx="5"/><rect x="70" y="76" width="250" height="24" rx="5"/><rect x="100" y="106" width="220" height="24" rx="5"/>
    <rect x="130" y="136" width="190" height="24" rx="5"/><rect x="100" y="166" width="220" height="24" rx="5"/><rect x="70" y="196" width="250" height="24" rx="5"/><rect x="40" y="226" width="280" height="24" rx="5"/>
  </g>
  <g font-family="Consolas, monospace" font-size="12" fill="#7f1d1d">
    <text x="50" y="63">if (account) {</text><text x="80" y="93">if (active) {</text><text x="110" y="123">if (amount &gt; 0) {</text>
    <text x="140" y="153">do the work 😰</text><text x="110" y="183">} else throw …</text><text x="80" y="213">} else throw …</text><text x="50" y="243">} else throw …</text>
  </g>
  <line x1="360" y1="40" x2="360" y2="250" stroke="#e2e8f0" stroke-width="2"/>
  <g fill="#fef3c7" stroke="#fbbf24">
    <rect x="400" y="56" width="280" height="26" rx="5"/><rect x="400" y="88" width="280" height="26" rx="5"/><rect x="400" y="120" width="280" height="26" rx="5"/>
  </g>
  <rect x="400" y="162" width="280" height="56" rx="8" fill="#bbf7d0" stroke="#22c55e"/>
  <g font-family="Consolas, monospace" font-size="12">
    <text x="410" y="74" fill="#78350f">if (!account) throw …   ⬅ exit</text>
    <text x="410" y="106" fill="#78350f">if (!active) throw …    ⬅ exit</text>
    <text x="410" y="138" fill="#78350f">if (amount &lt;= 0) throw … ⬅ exit</text>
    <text x="410" y="186" fill="#14532d" font-weight="700">// happy path, no nesting</text>
    <text x="410" y="206" fill="#14532d">do the work 😌</text>
  </g>
</svg>
