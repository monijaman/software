<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3730a3"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".22"/></filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="560" cy="40" r="140" fill="#fff" opacity=".07"/>
  <circle cx="80" cy="340" r="110" fill="#fff" opacity=".06"/>
  <text x="36" y="262" font-size="42" font-weight="800" fill="#fff">Microservices</text>
  <text x="38" y="302" font-size="21" fill="#fff" opacity=".88">Small services, big systems</text>

  <g stroke="#fff" stroke-width="3" opacity=".8">
    <line x1="470" y1="115" x2="380" y2="50"/><line x1="470" y1="115" x2="570" y2="50"/><line x1="470" y1="115" x2="370" y2="185"/>
    <line x1="470" y1="115" x2="575" y2="185"/>
  </g>
