    <g transform="translate(470 115)"><rect x="-40" y="-30" width="80" height="60" rx="14" fill="#fff"/><text y="0">🚪</text><text y="20" font-size="10" font-weight="700" fill="#3730a3">GATEWAY</text></g>
    <g transform="translate(380 50)"><circle r="28" fill="#e0e7ff"/><text y="8">👤</text></g>
    <g transform="translate(570 50)"><circle r="28" fill="#e0e7ff"/><text y="8">🛒</text></g>
    <g transform="translate(370 185)"><circle r="28" fill="#e0e7ff"/><text y="8">💳</text></g>
    <g transform="translate(575 185)"><circle r="28" fill="#e0e7ff"/><text y="8">📦</text></g>
