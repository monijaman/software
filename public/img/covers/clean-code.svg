<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0369a1"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".22"/></filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <circle cx="560" cy="40" r="140" fill="#fff" opacity=".07"/>
  <circle cx="80" cy="340" r="110" fill="#fff" opacity=".06"/>
  <text x="36" y="262" font-size="42" font-weight="800" fill="#fff">Clean Code</text>
  <text x="38" y="302" font-size="21" fill="#fff" opacity=".88">Readable · Simple · Changeable</text>

  <g filter="url(#sh)" transform="translate(330 30)">
    <rect width="280" height="170" rx="16" fill="#0f172a"/>
    <circle cx="20" cy="18" r="5" fill="#f87171"/><circle cx="36" cy="18" r="5" fill="#fbbf24"/><circle cx="52" cy="18" r="5" fill="#34d399"/>
    <g font-family="Consolas, monospace" font-size="14">
      <text x="18" y="56" fill="#c792ea">function <tspan fill="#82aaff">totalPrice</tspan><tspan fill="#e2e8f0">(cart) {</tspan></text>
      <text x="38" y="82" fill="#c792ea">return <tspan fill="#e2e8f0">cart.items</tspan></text>
      <text x="54" y="106" fill="#e2e8f0">.map(<tspan fill="#7fdbca">lineTotal</tspan>)</text>
      <text x="54" y="130" fill="#e2e8f0">.reduce(<tspan fill="#7fdbca">sum</tspan>, <tspan fill="#f78c6c">0</tspan>);</text>
      <text x="18" y="154" fill="#e2e8f0">}</text>
    </g>
  </g>
  <g transform="translate(590 205)" filter="url(#sh)"><circle r="30" fill="#fff"/><text y="11" text-anchor="middle" font-size="30">✨</text></g>
</svg>
