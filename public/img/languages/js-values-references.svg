<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="240" fill="#ffffff"/>
  <text x="190" y="30" font-size="15" font-weight="800" fill="#166534" text-anchor="middle">Primitive: copied by value</text>
  <rect x="40" y="50" width="130" height="70" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="105.0" y="78" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">a = 5</text>
  <rect x="210" y="50" width="130" height="70" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="275.0" y="78" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">b = 5</text>
  <line x1="170" y1="85" x2="208" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="189.0" y="78.0" font-size="11" fill="#475569" text-anchor="middle">copy</text>
  <text x="190" y="150" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">b++ changes only b</text>
  <text x="560" y="30" font-size="15" font-weight="800" fill="#1e40af" text-anchor="middle">Object: copied by reference</text>
  <rect x="410" y="50" width="110" height="60" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="465.0" y="78" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">user</text>
  <text x="465.0" y="100" font-size="11" fill="#334155" text-anchor="middle">address #42</text>
  <rect x="410" y="130" width="110" height="60" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="465.0" y="158" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">same</text>
  <text x="465.0" y="180" font-size="11" fill="#334155" text-anchor="middle">address #42</text>
  <rect x="600" y="75" width="140" height="90" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="670.0" y="103" font-size="15" font-weight="800" fill="#5b21b6" text-anchor="middle">🏠 { name }</text>
  <text x="670.0" y="125.0" font-size="11.5" fill="#334155" text-anchor="middle">one object in memory</text>
  <line x1="520" y1="80" x2="598" y2="105" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="520" y1="160" x2="598" y2="140" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="560" y="222" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">same.name = "Bo" changes what user sees too</text>
  <text x="190" y="222" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Copy objects with {...obj} or structuredClone()</text>
</svg>
