<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker></defs>
  <rect width="760" height="290" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Interfaces are satisfied automatically: no "implements" keyword</text>

  <!-- service -->
  <g transform="translate(20 100)">
    <rect width="170" height="90" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="85" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">OrderService</text>
    <text x="85" y="50" text-anchor="middle" font-size="11" fill="#475569" font-family="Consolas, monospace">notifier Notifier</text>
    <text x="85" y="72" text-anchor="middle" font-size="10" fill="#64748b">knows only the behavior</text>
  </g>

  <!-- interface socket -->
  <g transform="translate(250 85)">
    <rect width="190" height="120" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2.5" stroke-dasharray="7 4"/>
    <text x="95" y="28" text-anchor="middle" font-size="14" font-weight="800" fill="#155e75">interface Notifier</text>
    <rect x="18" y="44" width="154" height="30" rx="8" fill="#ffffff" stroke="#67e8f9"/>
    <text x="95" y="64" text-anchor="middle" font-size="11" fill="#0e7490" font-family="Consolas, monospace">Notify(to, msg) error</text>
    <text x="95" y="96" text-anchor="middle" font-size="10" fill="#475569">"anything with this method"</text>
  </g>
  <line x1="190" y1="145" x2="248" y2="145" stroke="#0891b2" stroke-width="2" marker-end="url(#arr)"/>
  <text x="219" y="137" text-anchor="middle" font-size="10" fill="#0e7490">uses</text>

  <!-- implementations -->
  <g font-size="12">
    <g transform="translate(510 44)">
      <rect width="230" height="62" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="14" y="24" font-weight="800" fill="#15803d">✉️ EmailNotifier ✅</text>
      <text x="14" y="44" font-size="11" fill="#334155" font-family="Consolas, monospace">func (e EmailNotifier) Notify…</text>
    </g>
    <g transform="translate(510 114)">
      <rect width="230" height="62" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="14" y="24" font-weight="800" fill="#15803d">📱 SMSNotifier ✅</text>
      <text x="14" y="44" font-size="11" fill="#334155" font-family="Consolas, monospace">func (s SMSNotifier) Notify…</text>
    </g>
    <g transform="translate(510 184)">
      <rect width="230" height="62" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="14" y="24" font-weight="800" fill="#15803d">🧪 FakeNotifier ✅ (tests)</text>
      <text x="14" y="44" font-size="11" fill="#334155" font-family="Consolas, monospace">func (f *FakeNotifier) Notify…</text>
    </g>
  </g>
  <g stroke="#0891b2" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <line x1="508" y1="75" x2="442" y2="120"/>
    <line x1="508" y1="145" x2="442" y2="145"/>
    <line x1="508" y1="215" x2="442" y2="170"/>
  </g>
  <text x="380" y="272" text-anchor="middle" font-size="12" fill="#475569">None of these types mention Notifier. Having the method is enough, so the service can use any of them.</text>
</svg>
