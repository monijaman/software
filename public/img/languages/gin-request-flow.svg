<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="240" fill="#ffffff"/>
  <rect x="15" y="40" width="130" height="100" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="80.0" y="68" font-size="15" font-weight="800" fill="#334155" text-anchor="middle">request</text>
  <text x="80.0" y="90" font-size="11" fill="#334155" text-anchor="middle">GET /api/v1/tasks</text>
  <rect x="165" y="40" width="130" height="100" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="230.0" y="68" font-size="15" font-weight="800" fill="#5b21b6" text-anchor="middle">middleware</text>
  <text x="230.0" y="90" font-size="11" fill="#334155" text-anchor="middle">recovery, id, auth</text>
  <line x1="147" y1="90" x2="163" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="315" y="40" width="130" height="100" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="380.0" y="68" font-size="15" font-weight="800" fill="#155e75" text-anchor="middle">handler</text>
  <text x="380.0" y="90" font-size="11" fill="#334155" text-anchor="middle">bind + validate</text>
  <text x="380.0" y="108" font-size="11" fill="#334155" text-anchor="middle">gin.Context</text>
  <line x1="297" y1="90" x2="313" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="465" y="40" width="130" height="100" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="530.0" y="68" font-size="15" font-weight="800" fill="#166534" text-anchor="middle">service</text>
  <text x="530.0" y="90" font-size="11" fill="#334155" text-anchor="middle">business rules</text>
  <text x="530.0" y="108" font-size="11" fill="#334155" text-anchor="middle">context.Context</text>
  <line x1="447" y1="90" x2="463" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="615" y="40" width="130" height="100" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="680.0" y="68" font-size="15" font-weight="800" fill="#9a3412" text-anchor="middle">repository</text>
  <text x="680.0" y="90" font-size="11" fill="#334155" text-anchor="middle">SQL / storage</text>
  <text x="680.0" y="108" font-size="11" fill="#334155" text-anchor="middle">interface</text>
  <line x1="597" y1="90" x2="613" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="25" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Gin stays at the HTTP edge. Services never import Gin.</text>
  <rect x="15" y="160" width="280" height="30" rx="8" fill="#ecfeff"/>
  <text x="155" y="180" font-size="11.5" font-weight="600" fill="#155e75" text-anchor="middle">HTTP layer: c.Param, c.JSON, status codes</text>
  <rect x="315" y="160" width="430" height="30" rx="8" fill="#f0fdf4"/>
  <text x="530" y="180" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">plain Go: domain errors mapped to HTTP in one place (writeError)</text>
  <text x="380" y="220" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">http.Server with timeouts + srv.Shutdown(ctx) on SIGTERM</text>
</svg>
