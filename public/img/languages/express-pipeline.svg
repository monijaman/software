<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="250" fill="#ffffff"/>
  <rect x="15" y="40" width="108" height="80" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="69.0" y="68" font-size="14" font-weight="800" fill="#334155" text-anchor="middle">request</text>
  <text x="69.0" y="90" font-size="11" fill="#334155" text-anchor="middle">POST /orders</text>
  <rect x="140" y="40" width="108" height="80" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="194.0" y="68" font-size="14" font-weight="800" fill="#5b21b6" text-anchor="middle">logger</text>
  <text x="194.0" y="90" font-size="11" fill="#334155" text-anchor="middle">app.use</text>
  <line x1="123" y1="80" x2="139" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="265" y="40" width="108" height="80" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="319.0" y="68" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">json()</text>
  <text x="319.0" y="90" font-size="11" fill="#334155" text-anchor="middle">parse body</text>
  <line x1="248" y1="80" x2="264" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="390" y="40" width="108" height="80" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="444.0" y="68" font-size="14" font-weight="800" fill="#9a3412" text-anchor="middle">auth</text>
  <text x="444.0" y="90" font-size="11" fill="#334155" text-anchor="middle">check token</text>
  <line x1="373" y1="80" x2="389" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="515" y="40" width="108" height="80" rx="14" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="569.0" y="68" font-size="14" font-weight="800" fill="#854d0e" text-anchor="middle">validate</text>
  <text x="569.0" y="90" font-size="11" fill="#334155" text-anchor="middle">check body</text>
  <line x1="498" y1="80" x2="514" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="640" y="40" width="108" height="80" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="694.0" y="68" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">handler</text>
  <text x="694.0" y="90" font-size="11" fill="#334155" text-anchor="middle">201 Created</text>
  <line x1="623" y1="80" x2="639" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="25" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">each middleware calls next() to pass the request on</text>
  <rect x="430" y="165" width="170" height="70" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="515.0" y="193" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">error handler</text>
  <text x="515.0" y="215.0" font-size="11.5" fill="#334155" text-anchor="middle">(err, req, res, next)</text>
  <line x1="505" y1="120" x2="510" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="470" y="148" font-size="11" fill="#475569" text-anchor="middle">next(err)</text>
  <line x1="620" y1="120" x2="590" y2="162" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="210" y="200" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">Order matters: body parser before routes,</text>
  <text x="210" y="218" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">error handler registered last.</text>
</svg>
