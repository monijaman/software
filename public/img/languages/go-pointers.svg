<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="300" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Value vs pointer: a photocopy or the address of the original?</text>

  <!-- value -->
  <rect x="15" y="40" width="355" height="245" rx="16" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="192" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="#c2410c">📄 birthdayCopy(u User)</text>
  <g font-size="12">
    <g transform="translate(35 84)">
      <rect width="130" height="70" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
      <text x="65" y="22" text-anchor="middle" font-weight="800" fill="#7c2d12">ana (caller)</text>
      <text x="65" y="44" text-anchor="middle" fill="#334155">Name: "Ana"</text>
      <text x="65" y="60" text-anchor="middle" font-weight="700" fill="#334155">Age: 30</text>
    </g>
    <g transform="translate(220 84)">
      <rect width="130" height="70" rx="10" fill="#ffffff" stroke="#f97316" stroke-width="2" stroke-dasharray="6 4"/>
      <text x="65" y="22" text-anchor="middle" font-weight="800" fill="#7c2d12">u (a copy)</text>
      <text x="65" y="44" text-anchor="middle" fill="#334155">Name: "Ana"</text>
      <text x="65" y="60" text-anchor="middle" font-weight="700" fill="#16a34a">Age: 31 ✏️</text>
    </g>
    <line x1="166" y1="119" x2="218" y2="119" stroke="#64748b" stroke-width="2" marker-end="url(#arrG)"/>
    <text x="192" y="111" text-anchor="middle" font-size="10" fill="#475569">copy</text>
  </g>
  <rect x="35" y="174" width="315" height="58" rx="10" fill="#fee2e2"/>
  <text x="192" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">The copy is changed, then thrown away</text>
  <text x="192" y="218" text-anchor="middle" font-size="12" fill="#7f1d1d">ana.Age is still 30</text>
  <text x="192" y="262" text-anchor="middle" font-size="11" fill="#9a3412">Fine for small, read-only values</text>

  <!-- pointer -->
  <rect x="390" y="40" width="355" height="245" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="567" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="#15803d">📍 birthdayPtr(u *User)</text>
  <g font-size="12">
    <g transform="translate(410 84)">
      <rect width="130" height="70" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <text x="65" y="22" text-anchor="middle" font-weight="800" fill="#14532d">ana @0xc000a0</text>
      <text x="65" y="44" text-anchor="middle" fill="#334155">Name: "Ana"</text>
      <text x="65" y="60" text-anchor="middle" font-weight="700" fill="#16a34a">Age: 31 ✏️</text>
    </g>
    <g transform="translate(595 94)">
      <rect width="130" height="50" rx="10" fill="#1e293b"/>
      <text x="65" y="22" text-anchor="middle" font-weight="800" fill="#bbf7d0">u = &amp;ana</text>
      <text x="65" y="40" text-anchor="middle" font-size="11" fill="#cbd5e1" font-family="Consolas, monospace">0xc000a0</text>
    </g>
    <line x1="594" y1="119" x2="542" y2="119" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arr)"/>
    <text x="568" y="111" text-anchor="middle" font-size="10" fill="#15803d">points to</text>
  </g>
  <rect x="410" y="174" width="315" height="58" rx="10" fill="#dcfce7"/>
  <text x="567" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">Changes go straight to the original</text>
  <text x="567" y="218" text-anchor="middle" font-size="12" fill="#14532d">ana.Age is now 31</text>
  <text x="567" y="262" text-anchor="middle" font-size="11" fill="#166534">&amp;x = "address of x"   ·   *p = "value at p"</text>
</svg>
