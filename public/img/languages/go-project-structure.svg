<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="310" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Module → packages → files, and the capital-letter rule</text>

  <!-- module -->
  <rect x="15" y="40" width="470" height="255" rx="16" fill="#ecfeff" stroke="#06b6d4" stroke-width="2.5"/>
  <text x="35" y="64" font-size="14" font-weight="800" fill="#155e75">📦 Module: github.com/you/shop</text>
  <text x="35" y="82" font-size="11" fill="#475569" font-family="Consolas, monospace">go.mod · go.sum</text>

  <!-- package main -->
  <g transform="translate(35 96)">
    <rect width="200" height="80" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <text x="14" y="24" font-size="13" font-weight="800" fill="#155e75">📁 package main</text>
    <text x="14" y="44" font-size="11" fill="#475569" font-family="Consolas, monospace">cmd/api/main.go</text>
    <text x="14" y="64" font-size="11" fill="#334155">func main() starts here</text>
  </g>
  <!-- package orders -->
  <g transform="translate(265 96)">
    <rect width="200" height="180" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <text x="14" y="24" font-size="13" font-weight="800" fill="#155e75">📁 package orders</text>
    <text x="14" y="42" font-size="11" fill="#475569" font-family="Consolas, monospace">internal/orders/*.go</text>
    <rect x="12" y="54" width="176" height="56" rx="8" fill="#dcfce7"/>
    <text x="22" y="72" font-size="11" font-weight="700" fill="#166534">✅ exported (Capital)</text>
    <text x="22" y="90" font-size="11" fill="#166534" font-family="Consolas, monospace">Order · Total() · MaxItems</text>
    <rect x="12" y="118" width="176" height="56" rx="8" fill="#fee2e2"/>
    <text x="22" y="136" font-size="11" font-weight="700" fill="#991b1b">🔒 unexported (lower)</text>
    <text x="22" y="154" font-size="11" fill="#991b1b" font-family="Consolas, monospace">order · total() · maxItems</text>
  </g>
  <!-- package store -->
  <g transform="translate(35 196)">
    <rect width="200" height="80" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <text x="14" y="24" font-size="13" font-weight="800" fill="#155e75">📁 package store</text>
    <text x="14" y="44" font-size="11" fill="#475569" font-family="Consolas, monospace">internal/store/*.go</text>
    <text x="14" y="64" font-size="11" fill="#334155">a library package</text>
  </g>

  <line x1="235" y1="136" x2="276" y2="166" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="250" y="190" font-size="10" fill="#16a34a" font-weight="700" text-anchor="middle">orders.Total() ✅</text>

  <!-- right: rules -->
  <g font-size="12">
    <rect x="505" y="40" width="240" height="255" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="625" y="66" text-anchor="middle" font-size="14" font-weight="800" fill="#334155">Rules</text>
    <text x="522" y="96" fill="#334155">• One folder = one package</text>
    <text x="522" y="122" fill="#334155">• Files in a package share</text>
    <text x="534" y="138" fill="#334155">every name, even lowercase</text>
    <text x="522" y="164" fill="#334155">• Other packages see only</text>
    <text x="534" y="180" fill="#334155">Capitalised names</text>
    <text x="522" y="206" fill="#334155">• internal/ can be imported</text>
    <text x="534" y="222" fill="#334155">only by this module</text>
    <text x="522" y="248" fill="#334155">• package main + func main()</text>
    <text x="534" y="264" fill="#334155">= a runnable program</text>
  </g>
</svg>
