<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker></defs>
  <rect width="760" height="310" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">A data race: count++ is really three steps, and they can interleave</text>

  <!-- columns -->
  <text x="150" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">Goroutine A</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">count in memory</text>
  <text x="610" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">Goroutine B</text>
  <line x1="380" y1="66" x2="380" y2="254" stroke="#e2e8f0" stroke-width="2"/>

  <g font-size="12" font-family="Consolas, monospace">
    <!-- t1 -->
    <rect x="60" y="72" width="180" height="28" rx="6" fill="#dbeafe"/><text x="150" y="91" text-anchor="middle" fill="#1e3a8a">① read → 5</text>
    <rect x="350" y="72" width="60" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="380" y="91" text-anchor="middle" fill="#0f172a">5</text>
    <!-- t2 -->
    <rect x="520" y="110" width="180" height="28" rx="6" fill="#ffedd5"/><text x="610" y="129" text-anchor="middle" fill="#7c2d12">② read → 5</text>
    <rect x="350" y="110" width="60" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="380" y="129" text-anchor="middle" fill="#0f172a">5</text>
    <!-- t3 -->
    <rect x="60" y="148" width="180" height="28" rx="6" fill="#dbeafe"/><text x="150" y="167" text-anchor="middle" fill="#1e3a8a">③ add 1, write 6</text>
    <rect x="350" y="148" width="60" height="28" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="380" y="167" text-anchor="middle" fill="#0f172a">6</text>
    <!-- t4 -->
    <rect x="520" y="186" width="180" height="28" rx="6" fill="#ffedd5"/><text x="610" y="205" text-anchor="middle" fill="#7c2d12">④ add 1, write 6</text>
    <rect x="350" y="186" width="60" height="28" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="380" y="205" text-anchor="middle" fill="#b91c1c" font-weight="700">6</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="240" y1="86" x2="348" y2="86"/><line x1="518" y1="124" x2="412" y2="124"/>
    <line x1="240" y1="162" x2="348" y2="162"/><line x1="518" y1="200" x2="412" y2="200"/>
  </g>
  <text x="380" y="240" text-anchor="middle" font-size="12" font-weight="800" fill="#b91c1c">Two increments, but count went 5 → 6. One update was lost.</text>

  <!-- fixes -->
  <g font-size="11" text-anchor="middle">
    <rect x="40" y="258" width="210" height="40" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="145" y="276" font-weight="700" fill="#15803d">mu.Lock(); count++; mu.Unlock()</text><text x="145" y="291" fill="#475569">one goroutine at a time</text>
    <rect x="275" y="258" width="210" height="40" rx="10" fill="#f0fdf4" stroke="#86efac"/>
    <text x="380" y="276" font-weight="700" fill="#15803d">counter.Add(1)  (atomic)</text><text x="380" y="291" fill="#475569">read+add+write as one step</text>
    <rect x="510" y="258" width="210" height="40" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="615" y="276" font-weight="700" fill="#1d4ed8">go test -race ./...</text><text x="615" y="291" fill="#475569">finds races automatically</text>
  </g>
</svg>
