<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f97316"/></marker></defs>
  <rect width="760" height="330" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">A slice is a small header that points into an array</text>

  <!-- section 1: header + array -->
  <text x="20" y="54" font-size="12" font-weight="700" fill="#334155">① nums := make([]int, 3, 5)   ·   part := nums[1:3]</text>
  <g font-family="Consolas, monospace" font-size="12">
    <g transform="translate(20 66)">
      <rect width="150" height="64" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
      <text x="75" y="18" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="800" fill="#155e75">nums</text>
      <text x="12" y="38" fill="#0e7490">ptr ●</text><text x="72" y="38" fill="#0e7490">len 3</text>
      <text x="72" y="54" fill="#0e7490">cap 5</text>
    </g>
    <g transform="translate(20 140)">
      <rect width="150" height="64" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <text x="75" y="18" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="800" fill="#c2410c">part</text>
      <text x="12" y="38" fill="#c2410c">ptr ●</text><text x="72" y="38" fill="#c2410c">len 2</text>
      <text x="72" y="54" fill="#c2410c">cap 4</text>
    </g>
    <!-- array -->
    <g transform="translate(230 100)">
      <rect x="0" width="64" height="44" fill="#ecfeff" stroke="#0891b2"/><text x="32" y="28" text-anchor="middle" fill="#155e75">10</text>
      <rect x="64" width="64" height="44" fill="#ffedd5" stroke="#0891b2"/><text x="96" y="28" text-anchor="middle" fill="#9a3412">20</text>
      <rect x="128" width="64" height="44" fill="#ffedd5" stroke="#0891b2"/><text x="160" y="28" text-anchor="middle" fill="#9a3412">30</text>
      <rect x="192" width="64" height="44" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="224" y="28" text-anchor="middle" fill="#94a3b8">·</text>
      <rect x="256" width="64" height="44" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/><text x="288" y="28" text-anchor="middle" fill="#94a3b8">·</text>
      <g font-size="10" fill="#64748b"><text x="32" y="58" text-anchor="middle">[0]</text><text x="96" y="58" text-anchor="middle">[1]</text><text x="160" y="58" text-anchor="middle">[2]</text><text x="224" y="58" text-anchor="middle">[3]</text><text x="288" y="58" text-anchor="middle">[4]</text></g>
    </g>
  </g>
  <path d="M64 104 C 120 104, 180 90, 236 106" fill="none" stroke="#0891b2" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M64 178 C 150 190, 250 170, 300 146" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrO)"/>
  <text x="390" y="88" text-anchor="middle" font-size="11" fill="#475569">shared underlying array (capacity 5)</text>
  <g font-size="11">
    <rect x="580" y="96" width="165" height="66" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="662" y="116" text-anchor="middle" font-weight="700" fill="#b91c1c">part[0] = 99</text>
    <text x="662" y="134" text-anchor="middle" fill="#7f1d1d">also changes nums[1]</text>
    <text x="662" y="150" text-anchor="middle" fill="#7f1d1d">(same memory)</text>
  </g>

  <!-- section 2: append growth -->
  <line x1="20" y1="222" x2="740" y2="222" stroke="#e2e8f0" stroke-width="2"/>
  <text x="20" y="246" font-size="12" font-weight="700" fill="#334155">② append with no room left: Go allocates a bigger array and copies</text>
  <g font-family="Consolas, monospace" font-size="12">
    <g transform="translate(20 262)">
      <rect x="0" width="48" height="36" fill="#ecfeff" stroke="#0891b2"/><text x="24" y="23" text-anchor="middle" fill="#155e75">10</text>
      <rect x="48" width="48" height="36" fill="#ecfeff" stroke="#0891b2"/><text x="72" y="23" text-anchor="middle" fill="#155e75">20</text>
      <rect x="96" width="48" height="36" fill="#ecfeff" stroke="#0891b2"/><text x="120" y="23" text-anchor="middle" fill="#155e75">30</text>
      <text x="72" y="54" text-anchor="middle" font-size="10" font-family="Segoe UI, sans-serif" fill="#64748b">old: len 3, cap 3 (full)</text>
    </g>
    <text x="215" y="285" font-size="12" font-family="Segoe UI, sans-serif" font-weight="700" fill="#0891b2">append(nums, 40) →</text>
    <g transform="translate(345 262)">
      <rect x="0" width="48" height="36" fill="#ecfeff" stroke="#0891b2"/><text x="24" y="23" text-anchor="middle" fill="#155e75">10</text>
      <rect x="48" width="48" height="36" fill="#ecfeff" stroke="#0891b2"/><text x="72" y="23" text-anchor="middle" fill="#155e75">20</text>
      <rect x="96" width="48" height="36" fill="#ecfeff" stroke="#0891b2"/><text x="120" y="23" text-anchor="middle" fill="#155e75">30</text>
      <rect x="144" width="48" height="36" fill="#dcfce7" stroke="#16a34a"/><text x="168" y="23" text-anchor="middle" fill="#166534">40</text>
      <rect x="192" width="48" height="36" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
      <rect x="240" width="48" height="36" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
      <text x="144" y="54" text-anchor="middle" font-size="10" font-family="Segoe UI, sans-serif" fill="#64748b">NEW array: len 4, cap 6</text>
    </g>
  </g>
  <text x="705" y="280" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">nums =</text>
  <text x="705" y="296" text-anchor="middle" font-size="11" font-weight="800" fill="#b91c1c">append(…)</text>
</svg>
