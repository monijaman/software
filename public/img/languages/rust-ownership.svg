<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="298" fill="#ffffff"/>
  <rect x="290" y="20" width="180" height="70" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="380.0" y="48" font-size="15" font-weight="800" fill="#9a3412" text-anchor="middle">📚 owner</text>
  <text x="380.0" y="70.0" font-size="10.5" fill="#334155" text-anchor="middle">let book = String::from(…)</text>
  <rect x="20" y="150" width="330" height="100" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="185.0" y="178" font-size="15" font-weight="800" fill="#1e40af" text-anchor="middle">many readers  &amp;T</text>
  <text x="185.0" y="200.0" font-size="11.5" fill="#334155" text-anchor="middle">let a = &amp;book;  let b = &amp;book;</text>
  <text x="185.0" y="218.5" font-size="11.5" fill="#334155" text-anchor="middle">read-only, any number at once</text>
  <rect x="410" y="150" width="330" height="100" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="575.0" y="178" font-size="15" font-weight="800" fill="#5b21b6" text-anchor="middle">one writer  &amp;mut T</text>
  <text x="575.0" y="200.0" font-size="11.5" fill="#334155" text-anchor="middle">let w = &amp;mut book;</text>
  <text x="575.0" y="218.5" font-size="11.5" fill="#334155" text-anchor="middle">exclusive: no other borrows meanwhile</text>
  <line x1="340" y1="90" x2="200" y2="147" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="250" y="112" font-size="11" fill="#475569" text-anchor="middle">lend</text>
  <line x1="420" y1="90" x2="560" y2="147" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="510" y="112" font-size="11" fill="#475569" text-anchor="middle">lend</text>
  <text x="380" y="135" font-size="13" font-weight="800" fill="#9a3412" text-anchor="middle">either / or</text>
  <text x="380" y="280" font-size="12.5" font-weight="600" fill="#334155" text-anchor="middle">Owner leaves scope → value dropped. References may never outlive the owner.</text>
</svg>
