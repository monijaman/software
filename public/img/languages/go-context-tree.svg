<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="310" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Contexts form a tree: cancel a parent, and every child stops</text>

  <!-- root -->
  <g transform="translate(270 40)">
    <rect width="220" height="56" rx="12" fill="#1e293b"/>
    <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#f8fafc">r.Context()  (HTTP request)</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#fca5a5">❌ user closed the tab → cancelled</text>
  </g>
  <!-- timeout child -->
  <g transform="translate(270 124)">
    <rect width="220" height="56" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="800" fill="#c2410c">WithTimeout(ctx, 2s)</text>
    <text x="110" y="42" text-anchor="middle" font-size="11" fill="#7c2d12">cancelled by parent (or after 2 s)</text>
  </g>
  <!-- leaves -->
  <g font-size="12" text-anchor="middle">
    <g transform="translate(30 220)"><rect width="200" height="62" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="100" y="24" font-weight="800" fill="#b91c1c">🗄️ db.QueryContext</text><text x="100" y="44" font-size="11" fill="#7f1d1d">query aborted, connection freed</text></g>
    <g transform="translate(280 220)"><rect width="200" height="62" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="100" y="24" font-weight="800" fill="#b91c1c">🌐 payments API call</text><text x="100" y="44" font-size="11" fill="#7f1d1d">HTTP request cancelled</text></g>
    <g transform="translate(530 220)"><rect width="200" height="62" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="100" y="24" font-weight="800" fill="#b91c1c">⚙️ your goroutine</text><text x="100" y="44" font-size="11" fill="#7f1d1d" font-family="Consolas, monospace">case &lt;-ctx.Done(): return</text></g>
  </g>
  <g stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="6 4">
    <line x1="380" y1="96" x2="380" y2="122"/>
    <path d="M380 180 L380 200 L130 200 L130 218"/>
    <line x1="380" y1="200" x2="380" y2="218"/>
    <path d="M380 200 L630 200 L630 218"/>
  </g>
  <g font-size="11" fill="#475569">
    <text x="520" y="62">⬇ cancellation flows</text>
    <text x="520" y="78">down to every child</text>
    <text x="520" y="150" fill="#0f172a" font-weight="700" font-family="Consolas, monospace">defer cancel()</text>
    <text x="520" y="166">always release it</text>
  </g>
  <text x="380" y="302" text-anchor="middle" font-size="11" fill="#475569">ctx.Err() tells you why: context.Canceled or context.DeadlineExceeded</text>
</svg>
