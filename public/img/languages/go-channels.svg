<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker></defs>
  <rect width="760" height="310" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Unbuffered vs buffered channels</text>

  <!-- unbuffered -->
  <rect x="15" y="40" width="730" height="120" rx="16" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="35" y="64" font-size="13" font-weight="800" fill="#155e75">make(chan T): unbuffered, a hand-to-hand handoff</text>
  <g font-size="12" text-anchor="middle">
    <g transform="translate(40 78)"><rect width="140" height="64" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/><text x="70" y="26" font-weight="800" fill="#155e75">🙋 sender</text><text x="70" y="46" font-size="11" fill="#334155" font-family="Consolas, monospace">ch &lt;- order</text></g>
    <g transform="translate(300 88)"><circle cx="30" cy="22" r="22" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/><text x="30" y="28" font-size="18">📦</text></g>
    <g transform="translate(450 78)"><rect width="140" height="64" rx="12" fill="#ffffff" stroke="#0891b2" stroke-width="2"/><text x="70" y="26" font-weight="800" fill="#155e75">🙋 receiver</text><text x="70" y="46" font-size="11" fill="#334155" font-family="Consolas, monospace">o := &lt;-ch</text></g>
  </g>
  <line x1="182" y1="110" x2="296" y2="110" stroke="#0891b2" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="364" y1="110" x2="448" y2="110" stroke="#0891b2" stroke-width="2" marker-end="url(#arr)"/>
  <g font-size="11" fill="#334155">
    <text x="610" y="96">Both sides wait until</text>
    <text x="610" y="112">they meet. Nothing is</text>
    <text x="610" y="128">stored in between.</text>
  </g>

  <!-- buffered -->
  <rect x="15" y="176" width="730" height="120" rx="16" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="35" y="200" font-size="13" font-weight="800" fill="#15803d">make(chan T, 3): buffered, a shelf with 3 slots</text>
  <g font-size="12" text-anchor="middle">
    <g transform="translate(40 214)"><rect width="140" height="64" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="70" y="26" font-weight="800" fill="#15803d">🙋 sender</text><text x="70" y="46" font-size="10" fill="#334155">drops and leaves</text></g>
    <g transform="translate(225 218)">
      <rect width="190" height="56" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
      <rect x="8" y="8" width="54" height="40" rx="6" fill="#dcfce7"/><text x="35" y="34" font-size="16">📦</text>
      <rect x="68" y="8" width="54" height="40" rx="6" fill="#dcfce7"/><text x="95" y="34" font-size="16">📦</text>
      <rect x="128" y="8" width="54" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
    </g>
    <g transform="translate(450 214)"><rect width="140" height="64" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text x="70" y="26" font-weight="800" fill="#15803d">🙋 receiver</text><text x="70" y="46" font-size="10" fill="#334155">takes when ready</text></g>
  </g>
  <line x1="182" y1="246" x2="223" y2="246" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="417" y1="246" x2="448" y2="246" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="320" y="290" text-anchor="middle" font-size="10" fill="#475569">len 2 · cap 3</text>
  <g font-size="11" fill="#334155">
    <text x="610" y="232">Sender blocks only</text>
    <text x="610" y="248">when the shelf is full;</text>
    <text x="610" y="264">receiver only when empty.</text>
  </g>
</svg>
