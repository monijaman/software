  <text x="287.5" y="126.5" font-size="11.5" fill="#334155" text-anchor="middle">for everyone</text>
  <line x1="187" y1="95" x2="203" y2="95" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
