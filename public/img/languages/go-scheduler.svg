  <circle cx="550" cy="62" r="18" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="550" y="67" font-size="13" font-weight="800" fill="#155e75" text-anchor="middle">G</text>
  <circle cx="620" cy="62" r="18" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
