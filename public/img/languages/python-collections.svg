<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="240" fill="#ffffff"/>
  <rect x="20" y="20" width="170" height="150" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="105.0" y="48" font-size="20" font-weight="800" fill="#1e40af" text-anchor="middle">list</text>
  <text x="105.0" y="70" font-size="12" fill="#334155" text-anchor="middle">[1, 2, 3]</text>
  <text x="105.0" y="89" font-size="12" fill="#334155" text-anchor="middle">ordered, changeable</text>
  <text x="105.0" y="108" font-size="12" fill="#334155" text-anchor="middle">x in list: O(n)</text>
  <rect x="205" y="20" width="170" height="150" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="290.0" y="48" font-size="20" font-weight="800" fill="#334155" text-anchor="middle">tuple</text>
  <text x="290.0" y="70" font-size="12" fill="#334155" text-anchor="middle">(3, 4)</text>
  <text x="290.0" y="89" font-size="12" fill="#334155" text-anchor="middle">fixed, immutable</text>
  <text x="290.0" y="108" font-size="12" fill="#334155" text-anchor="middle">can be a dict key</text>
  <rect x="390" y="20" width="170" height="150" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="475.0" y="48" font-size="20" font-weight="800" fill="#166534" text-anchor="middle">dict</text>
  <text x="475.0" y="70" font-size="12" fill="#334155" text-anchor="middle">{"a": 1}</text>
  <text x="475.0" y="89" font-size="12" fill="#334155" text-anchor="middle">key → value</text>
  <text x="475.0" y="108" font-size="12" fill="#334155" text-anchor="middle">lookup: O(1)</text>
  <rect x="575" y="20" width="170" height="150" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="660.0" y="48" font-size="20" font-weight="800" fill="#5b21b6" text-anchor="middle">set</text>
  <text x="660.0" y="70" font-size="12" fill="#334155" text-anchor="middle">{1, 2}</text>
  <text x="660.0" y="89" font-size="12" fill="#334155" text-anchor="middle">unique values</text>
  <text x="660.0" y="108" font-size="12" fill="#334155" text-anchor="middle">x in set: O(1)</text>
  <text x="380" y="200" font-size="12.5" font-weight="600" fill="#854d0e" text-anchor="middle">[n * n for n in range(10)]   {u.id: u for u in users}   sum(x for x in xs)</text>
  <text x="380" y="222" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">comprehensions build all four in one readable line</text>
</svg>
