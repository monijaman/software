<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker>
  <marker id="arrC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891b2"/></marker></defs>
  <rect width="760" height="290" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">Wrapping errors: each layer adds context, the cause stays inside</text>

  <!-- nested boxes (Russian doll) -->
  <rect x="20" y="44" width="470" height="200" rx="16" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="38" y="68" font-size="12" font-weight="800" fill="#5b21b6">handler receives:</text>
  <text x="38" y="86" font-size="11" fill="#334155" font-family="Consolas, monospace">"checkout for user 42: find user: not found"</text>

  <rect x="50" y="100" width="410" height="128" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="68" y="122" font-size="12" font-weight="800" fill="#c2410c">service wraps:</text>
  <text x="68" y="140" font-size="11" fill="#334155" font-family="Consolas, monospace">fmt.Errorf("checkout for user %s: %w", id, err)</text>

  <rect x="80" y="154" width="350" height="60" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="98" y="176" font-size="12" font-weight="800" fill="#155e75">store wraps:</text>
  <text x="98" y="196" font-size="10" fill="#334155" font-family="Consolas, monospace">fmt.Errorf("find user: %w", ErrNotFound)</text>

  <g transform="translate(346 160)">
    <rect width="78" height="48" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="39" y="21" text-anchor="middle" font-size="10" font-weight="800" fill="#b91c1c">ErrNotFound</text>
    <text x="39" y="38" text-anchor="middle" font-size="10" fill="#7f1d1d">the cause</text>
  </g>

  <!-- right: the checks -->
  <g font-size="12">
    <rect x="515" y="44" width="225" height="92" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="627" y="66" text-anchor="middle" font-weight="800" fill="#15803d">errors.Is(err, ErrNotFound)</text>
    <text x="627" y="88" text-anchor="middle" fill="#334155">unwraps layer by layer</text>
    <text x="627" y="106" text-anchor="middle" fill="#334155">until it finds a match</text>
    <text x="627" y="126" text-anchor="middle" font-weight="800" fill="#15803d">→ true → return 404</text>

    <rect x="515" y="152" width="225" height="92" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="627" y="174" text-anchor="middle" font-weight="800" fill="#b91c1c">err == ErrNotFound</text>
    <text x="627" y="196" text-anchor="middle" fill="#334155">compares only the outer</text>
    <text x="627" y="214" text-anchor="middle" fill="#334155">box</text>
    <text x="627" y="234" text-anchor="middle" font-weight="800" fill="#b91c1c">→ false ❌</text>
  </g>
  <path d="M490 90 C 500 90, 505 90, 513 90" stroke="#0891b2" stroke-width="2" fill="none" marker-end="url(#arrC)"/>
  <text x="380" y="270" text-anchor="middle" font-size="12" fill="#475569">%w wraps (keeps the chain)   ·   %v only copies the text (chain lost)</text>
</svg>
