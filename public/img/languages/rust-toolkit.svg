<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="200" fill="#ffffff"/>
  <rect x="15" y="20" width="135" height="135" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="82.5" y="58" font-size="28" text-anchor="middle">🧩</text>
  <text x="82.5" y="86" font-size="13.5" font-weight="800" fill="#9a3412" text-anchor="middle">enum + match</text>
  <text x="82.5" y="108" font-size="11" fill="#334155" text-anchor="middle">every case</text>
  <text x="82.5" y="126" font-size="11" fill="#334155" text-anchor="middle">handled</text>
  <rect x="165" y="20" width="135" height="135" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="232.5" y="58" font-size="28" text-anchor="middle">🎁</text>
  <text x="232.5" y="86" font-size="13.5" font-weight="800" fill="#166534" text-anchor="middle">Option / Result</text>
  <text x="232.5" y="108" font-size="11" fill="#334155" text-anchor="middle">no null,</text>
  <text x="232.5" y="126" font-size="11" fill="#334155" text-anchor="middle">no exceptions, ?</text>
  <rect x="315" y="20" width="135" height="135" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="382.5" y="58" font-size="28" text-anchor="middle">🔌</text>
  <text x="382.5" y="86" font-size="13.5" font-weight="800" fill="#1e40af" text-anchor="middle">traits</text>
  <text x="382.5" y="108" font-size="11" fill="#334155" text-anchor="middle">shared behaviour,</text>
  <text x="382.5" y="126" font-size="11" fill="#334155" text-anchor="middle">zero cost</text>
  <rect x="465" y="20" width="135" height="135" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="532.5" y="58" font-size="28" text-anchor="middle">📦</text>
  <text x="532.5" y="86" font-size="13.5" font-weight="800" fill="#5b21b6" text-anchor="middle">Box Rc Arc</text>
  <text x="532.5" y="108" font-size="11" fill="#334155" text-anchor="middle">heap and shared</text>
  <text x="532.5" y="126" font-size="11" fill="#334155" text-anchor="middle">ownership</text>
  <rect x="615" y="20" width="135" height="135" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text x="682.5" y="58" font-size="28" text-anchor="middle">🧵</text>
  <text x="682.5" y="86" font-size="13.5" font-weight="800" fill="#155e75" text-anchor="middle">Send + Sync</text>
  <text x="682.5" y="108" font-size="11" fill="#334155" text-anchor="middle">data races are</text>
  <text x="682.5" y="126" font-size="11" fill="#334155" text-anchor="middle">compile errors</text>
  <text x="380" y="185" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">The compiler checks the plans before anything is built.</text>
</svg>
