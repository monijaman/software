<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="260" fill="#ffffff"/>
  <rect x="40" y="80" width="170" height="90" rx="14" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="125.0" y="108" font-size="16" font-weight="800" fill="#854d0e" text-anchor="middle">⏳ pending</text>
  <text x="125.0" y="130.0" font-size="11.5" fill="#334155" text-anchor="middle">waiting for the result</text>
  <rect x="540" y="20" width="190" height="90" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="635.0" y="48" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">✅ fulfilled</text>
  <text x="635.0" y="70.0" font-size="11.5" fill="#334155" text-anchor="middle">has a value</text>
  <text x="635.0" y="88.5" font-size="11.5" fill="#334155" text-anchor="middle">.then / await</text>
  <rect x="540" y="140" width="190" height="90" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="635.0" y="168" font-size="16" font-weight="800" fill="#991b1b" text-anchor="middle">❌ rejected</text>
  <text x="635.0" y="190.0" font-size="11.5" fill="#334155" text-anchor="middle">has a reason (error)</text>
  <text x="635.0" y="208.5" font-size="11.5" fill="#334155" text-anchor="middle">.catch / try-catch</text>
  <line x1="210" y1="110" x2="536" y2="65" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="370" y="74" font-size="11" fill="#475569" text-anchor="middle">resolve(value)</text>
  <line x1="210" y1="140" x2="536" y2="185" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="370" y="182" font-size="11" fill="#475569" text-anchor="middle">reject(error) or throw</text>
  <text x="385" y="245" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Settles exactly once. Once settled it never changes.</text>
</svg>
