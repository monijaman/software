<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="245" fill="#ffffff"/>
  <rect x="10" y="50" width="82" height="56" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="51.0" y="78" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">Request</text>
  <rect x="103" y="50" width="82" height="56" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="144.0" y="78" font-size="11.5" font-weight="800" fill="#5b21b6" text-anchor="middle">Middleware</text>
  <line x1="92" y1="78" x2="102" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="196" y="50" width="82" height="56" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="237.0" y="78" font-size="11.5" font-weight="800" fill="#9a3412" text-anchor="middle">Guards</text>
  <line x1="185" y1="78" x2="195" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="289" y="50" width="82" height="56" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="330.0" y="78" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">Interceptors</text>
  <line x1="278" y1="78" x2="288" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="382" y="50" width="82" height="56" rx="14" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="423.0" y="78" font-size="11.5" font-weight="800" fill="#854d0e" text-anchor="middle">Pipes</text>
  <line x1="371" y1="78" x2="381" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="475" y="50" width="82" height="56" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="516.0" y="78" font-size="11.5" font-weight="800" fill="#166534" text-anchor="middle">Controller</text>
  <line x1="464" y1="78" x2="474" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="568" y="50" width="82" height="56" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="609.0" y="78" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">Interceptors</text>
  <line x1="557" y1="78" x2="567" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="661" y="50" width="82" height="56" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="702.0" y="78" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">Response</text>
  <line x1="650" y1="78" x2="660" y2="78" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="380" y="30" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">The order NestJS runs things for every request</text>
  <text x="330" y="124" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">before</text>
  <text x="609" y="124" font-size="10" font-weight="400" fill="#64748b" text-anchor="middle">after</text>
  <rect x="290" y="165" width="180" height="64" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="380.0" y="193" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">Exception filters</text>
  <text x="380.0" y="215" font-size="11" fill="#334155" text-anchor="middle">turn errors into responses</text>
  <line x1="380" y1="106" x2="380" y2="162" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arr)"/>
  <text x="415" y="140" font-size="11" fill="#475569" text-anchor="middle">on throw</text>
  <text x="130" y="190" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">auth → Guards</text>
  <text x="130" y="208" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">validation → Pipes</text>
  <text x="630" y="190" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">timing, caching → Interceptors</text>
  <text x="630" y="208" font-size="12" font-weight="400" fill="#334155" text-anchor="middle">error format → Filters</text>
</svg>
