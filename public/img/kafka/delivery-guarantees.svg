<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="240" fill="#ffffff"/>
  <g text-anchor="middle">
    <g transform="translate(130 20)">
      <rect x="-115" width="230" height="200" rx="16" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
      <text y="40" font-size="30">📮</text><text y="76" font-size="16" font-weight="800" fill="#991b1b">At most once</text>
      <text y="100" font-size="12" fill="#475569">0 or 1 copy</text>
      <g font-size="22"><text x="-30" y="140">✉️</text><text x="30" y="140" opacity=".3">✉️</text></g>
      <text x="30" y="140" font-size="22">❌</text>
      <text y="180" font-size="11" fill="#b91c1c">may lose · never duplicates</text>
    </g>
    <g transform="translate(380 20)">
      <rect x="-115" width="230" height="200" rx="16" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
      <text y="40" font-size="30">📦</text><text y="76" font-size="16" font-weight="800" fill="#854d0e">At least once</text>
      <text y="100" font-size="12" fill="#475569">1 or more copies</text>
      <g font-size="22"><text x="-30" y="140">✉️</text><text x="30" y="140">✉️</text></g>
      <text y="180" font-size="11" fill="#a16207">never loses · may duplicate</text>
    </g>
    <g transform="translate(630 20)">
      <rect x="-115" width="230" height="200" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
      <text y="40" font-size="30">✅</text><text y="76" font-size="16" font-weight="800" fill="#065f46">Exactly once</text>
      <text y="100" font-size="12" fill="#475569">exactly 1 effect</text>
      <g font-size="22"><text y="140">✉️</text></g>
      <text y="180" font-size="11" fill="#047857">idempotence + transactions</text>
    </g>
  </g>
</svg>
