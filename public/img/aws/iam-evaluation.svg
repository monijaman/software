<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="Segoe UI, system-ui, sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect width="760" height="260" fill="#ffffff"/>
  <rect x="15" y="90" width="120" height="70" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="75.0" y="114" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">Request</text>
  <text x="75.0" y="133" font-size="10" fill="#334155" text-anchor="middle">principal + action</text>
  <text x="75.0" y="149" font-size="10" fill="#334155" text-anchor="middle">+ resource</text>
  <rect x="165" y="90" width="130" height="70" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="230.0" y="114" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">Explicit Deny?</text>
  <text x="230.0" y="133" font-size="11" fill="#334155" text-anchor="middle">any policy</text>
  <rect x="325" y="90" width="130" height="70" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="390.0" y="114" font-size="13" font-weight="800" fill="#9a3412" text-anchor="middle">SCP / boundary</text>
  <text x="390.0" y="133" font-size="11" fill="#334155" text-anchor="middle">allow it?</text>
  <rect x="485" y="90" width="130" height="70" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="550.0" y="114" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">Explicit Allow?</text>
  <text x="550.0" y="133" font-size="10" fill="#334155" text-anchor="middle">identity or resource</text>
  <rect x="645" y="90" width="100" height="70" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="695.0" y="114" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">✅ Allow</text>
  <line x1="135" y1="125" x2="163" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="295" y1="125" x2="323" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="309.0" y="117" font-size="10.5" fill="#475569" text-anchor="middle">no</text>
  <line x1="455" y1="125" x2="483" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="469.0" y="117" font-size="10.5" fill="#475569" text-anchor="middle">yes</text>
  <line x1="615" y1="125" x2="643" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="629.0" y="117" font-size="10.5" fill="#475569" text-anchor="middle">yes</text>
  <rect x="300" y="200" width="170" height="48" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="385.0" y="224" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">❌ Deny</text>
  <line x1="230" y1="160" x2="330" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="265" y="188" font-size="10.5" fill="#475569" text-anchor="middle">yes</text>
  <line x1="390" y1="160" x2="385" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="402" y="183" font-size="10.5" fill="#475569" text-anchor="middle">no</text>
  <line x1="550" y1="160" x2="440" y2="198" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="512" y="188" font-size="10.5" fill="#475569" text-anchor="middle">no</text>
  <text x="380" y="40" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Everything is denied by default. An explicit Deny always wins.</text>
  <text x="380" y="60" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">SCPs, boundaries and session policies only limit; they never grant.</text>
</svg>
