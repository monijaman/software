<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="250" fill="#ffffff"/>
  <g text-anchor="middle">
    <g transform="translate(130 20)">
      <rect x="-115" width="230" height="210" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <text y="40" font-size="30">🖼️</text><text y="76" font-size="22" font-weight="800" fill="#0f172a">LCP</text>
      <text y="98" font-size="12" fill="#475569">Is it loading?</text>
      <rect x="-90" y="120" width="72" height="16" fill="#22c55e"/><rect x="-18" y="120" width="54" height="16" fill="#f59e0b"/><rect x="36" y="120" width="54" height="16" fill="#ef4444"/>
      <g font-size="11" fill="#334155"><text x="-18" y="154">2.5 s</text><text x="36" y="154">4 s</text></g>
      <text y="190" font-size="12" font-weight="700" fill="#15803d">good ≤ 2.5 s</text>
    </g>
    <g transform="translate(380 20)">
      <rect x="-115" width="230" height="210" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <text y="40" font-size="30">👆</text><text y="76" font-size="22" font-weight="800" fill="#0f172a">INP</text>
      <text y="98" font-size="12" fill="#475569">Does it respond quickly?</text>
      <rect x="-90" y="120" width="72" height="16" fill="#22c55e"/><rect x="-18" y="120" width="54" height="16" fill="#f59e0b"/><rect x="36" y="120" width="54" height="16" fill="#ef4444"/>
      <g font-size="11" fill="#334155"><text x="-18" y="154">200 ms</text><text x="36" y="154">500 ms</text></g>
      <text y="190" font-size="12" font-weight="700" fill="#15803d">good ≤ 200 ms</text>
    </g>
    <g transform="translate(630 20)">
      <rect x="-115" width="230" height="210" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
      <text y="40" font-size="30">📐</text><text y="76" font-size="22" font-weight="800" fill="#0f172a">CLS</text>
      <text y="98" font-size="12" fill="#475569">Is it visually stable?</text>
      <rect x="-90" y="120" width="72" height="16" fill="#22c55e"/><rect x="-18" y="120" width="54" height="16" fill="#f59e0b"/><rect x="36" y="120" width="54" height="16" fill="#ef4444"/>
      <g font-size="11" fill="#334155"><text x="-18" y="154">0.1</text><text x="36" y="154">0.25</text></g>
      <text y="190" font-size="12" font-weight="700" fill="#15803d">good ≤ 0.1</text>
    </g>
  </g>
</svg>
