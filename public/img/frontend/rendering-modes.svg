<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" font-family="Segoe UI, system-ui, sans-serif">
  <rect width="760" height="270" fill="#ffffff"/>
  <text x="140" y="24" font-size="12" font-weight="700" fill="#64748b">time →</text>
  <g font-size="13" font-weight="800">
    <text x="20" y="66" fill="#1e3a8a">CSR</text><text x="20" y="126" fill="#065f46">SSR</text><text x="20" y="186" fill="#7c2d12">SSG</text><text x="20" y="246" fill="#6d28d9">ISR</text>
  </g>
  <g font-size="11" font-weight="700">
    <g transform="translate(80 44)"><rect width="90" height="34" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/><text x="45" y="21" text-anchor="middle" fill="#475569">empty HTML</text><rect x="94" width="150" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="169" y="21" text-anchor="middle" fill="#92400e">download + run JS</text><rect x="248" width="110" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="303" y="21" text-anchor="middle" fill="#92400e">fetch data</text><rect x="362" width="110" height="34" rx="6" fill="#bbf7d0" stroke="#22c55e"/><text x="417" y="21" text-anchor="middle" fill="#14532d">👀 visible</text></g>
    <g transform="translate(80 104)"><rect width="170" height="34" rx="6" fill="#e0e7ff" stroke="#6366f1"/><text x="85" y="21" text-anchor="middle" fill="#3730a3">server fetches + renders</text><rect x="174" width="110" height="34" rx="6" fill="#bbf7d0" stroke="#22c55e"/><text x="229" y="21" text-anchor="middle" fill="#14532d">👀 visible</text><rect x="288" width="120" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="348" y="21" text-anchor="middle" fill="#92400e">hydrate → 🖱️</text></g>
    <g transform="translate(80 164)"><rect width="60" height="34" rx="6" fill="#bbf7d0" stroke="#22c55e"/><text x="30" y="21" text-anchor="middle" fill="#14532d">👀</text><rect x="64" width="120" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="124" y="21" text-anchor="middle" fill="#92400e">hydrate → 🖱️</text><text x="200" y="21" fill="#7c2d12" font-weight="400">HTML built at deploy time, served from a CDN</text></g>
    <g transform="translate(80 224)"><rect width="60" height="34" rx="6" fill="#bbf7d0" stroke="#22c55e"/><text x="30" y="21" text-anchor="middle" fill="#14532d">👀</text><rect x="64" width="120" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/><text x="124" y="21" text-anchor="middle" fill="#92400e">hydrate → 🖱️</text><rect x="200" width="220" height="34" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-dasharray="5 4"/><text x="310" y="21" text-anchor="middle" fill="#5b21b6">🔄 regenerates in background</text></g>
  </g>
  <g transform="translate(580 60)" font-size="11.5" fill="#334155">
    <rect width="160" height="170" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="14" y="26" font-weight="800" fill="#0f172a">Where HTML is made</text>
    <text x="14" y="54">CSR → the browser</text><text x="14" y="80">SSR → server, per request</text><text x="14" y="106">SSG → at build time</text><text x="14" y="132">ISR → build time +</text><text x="42" y="148">timed refresh</text>
  </g>
</svg>
